<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="按产品线、载体、系统和版本检索 Web 与 APP 交互原型。">
  <title>交互式原型中心</title>
  <link rel="stylesheet" href="hub.css">
  <script type="module" src="hub.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="./" aria-label="返回原型中心首页">
        <span class="brand-mark" aria-hidden="true">PH</span>
        <span>
          <strong>交互式原型中心</strong>
          <small>Web / APP Prototype Directory</small>
        </span>
      </a>
      <div class="header-meta" aria-label="目录状态">
        <span><strong id="entryTotal">--</strong> 个原型</span>
        <span><strong id="seriesTotal">--</strong> 个系列</span>
        <a href="https://github.com/HawZZ/root-interactivable-prototype">GitHub 仓库</a>
      </div>
    </div>
  </header>

  <main class="shell">
    <section class="directory-tools" aria-labelledby="directoryTitle">
      <div class="directory-heading">
        <div>
          <h1 id="directoryTitle">查找原型</h1>
          <p>搜索业务、功能、版本或固定路径。</p>
        </div>
        <div class="view-switch" role="group" aria-label="目录视图">
          <button type="button" data-view="all" aria-pressed="true">全部</button>
          <button type="button" data-view="favorites" aria-pressed="false">收藏</button>
          <button type="button" data-view="recent" aria-pressed="false">最近访问</button>
        </div>
      </div>

      <label class="search-field" for="searchInput">
        <span>搜索</span>
        <input id="searchInput" type="search" placeholder="例如：设备共享、Alexa、V3、/prototypes/..." autocomplete="off">
        <kbd>/</kbd>
      </label>

      <nav class="product-lines" id="productLines" aria-label="业务产品线"></nav>

      <div class="facet-row" aria-label="辅助筛选与排序">
        <label>
          <span>载体</span>
          <select id="surfaceFilter">
            <option value="all">全部载体</option>
            <option value="web">Web</option>
            <option value="app">APP</option>
          </select>
        </label>
        <label>
          <span>系统</span>
          <select id="systemFilter">
            <option value="all">全部系统</option>
          </select>
        </label>
        <label>
          <span>状态</span>
          <select id="statusFilter">
            <option value="all">全部状态</option>
            <option value="active">使用中</option>
            <option value="draft">草稿</option>
            <option value="archived">已归档</option>
          </select>
        </label>
        <label class="sort-control">
          <span>排序</span>
          <select id="sortSelect">
            <option value="updated-desc">最近更新</option>
            <option value="updated-asc">最早更新</option>
            <option value="title-asc">名称 A-Z</option>
            <option value="versions-desc">版本数量</option>
          </select>
        </label>
        <button class="reset-button" id="resetFilters" type="button">重置</button>
      </div>
    </section>

    <section class="results" aria-labelledby="resultsTitle" aria-live="polite">
      <div class="results-head">
        <div>
          <h2 id="resultsTitle">原型目录</h2>
          <p id="resultSummary">正在加载目录...</p>
        </div>
        <p class="generated-at" id="generatedAt"></p>
      </div>

      <div class="library" id="library">
        <article class="skeleton" aria-hidden="true"></article>
        <article class="skeleton" aria-hidden="true"></article>
        <article class="skeleton" aria-hidden="true"></article>
        <article class="skeleton" aria-hidden="true"></article>
      </div>

      <div class="empty-state" id="emptyState" hidden>
        <strong>没有匹配的原型</strong>
        <p>调整关键词或清除部分筛选条件。</p>
        <button type="button" data-action="clear-filters">清除筛选</button>
      </div>

      <div class="error-state" id="errorState" hidden>
        <strong>目录加载失败</strong>
        <p>请刷新页面；如果问题持续存在，请检查最近一次 Pages 构建。</p>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <noscript><p class="noscript">该目录需要 JavaScript 才能读取自动生成的原型索引。</p></noscript>
</body>
</html>
