name: Deploy static content to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate metadata
        run: npm run catalog:check

      - name: Run catalog tests
        run: npm test

      - name: Build static catalog
        run: npm run build

      - name: Capture prototype previews
        run: npm run previews

      - name: Validate routes and links
        run: npm run check:links

      - name: Run browser tests
        run: npm run test:e2e

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        id: upload
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        timeout-minutes: 12
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          PAGES_ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        with:
          script: |
            const artifactId = Number(process.env.PAGES_ARTIFACT_ID)
            if (!Number.isSafeInteger(artifactId) || artifactId < 1) {
              throw new Error('Upload did not return a valid artifact ID')
            }
            const wait = ms => new Promise(resolve => setTimeout(resolve, ms))
            const repo = context.repo
            let ready = false
            for (let attempt = 0; attempt < 24; attempt++) {
              const { data } = await github.rest.actions.listWorkflowRunArtifacts({
                ...repo, run_id: context.runId, name: 'github-pages'
              })
              ready = data.artifacts.some(a => a.id === artifactId && !a.expired && a.size_in_bytes > 0)
              if (ready) break
              await wait(5000)
            }
            if (!ready) throw new Error('The uploaded Pages artifact is not visible in this run')
            const idToken = await core.getIDToken()
            core.setSecret(idToken)
            const { data: deployment } = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              ...repo, artifact_id: artifactId, pages_build_version: context.sha, oidc_token: idToken
            })
            const deploymentId = deployment.id || new URL(deployment.status_url).pathname.split('/').pop()
            for (let attempt = 0; attempt < 110; attempt++) {
              await wait(5000)
              const { data } = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{deployment_id}', {
                ...repo, deployment_id: deploymentId
              })
              if (data.status === 'succeed') {
                core.setOutput('page_url', deployment.page_url)
                return
              }
              if (['deployment_failed', 'content_failed', 'unknown_error', 'deployment_cancelled', 'cancelled'].includes(data.status)) {
                throw new Error('Pages deployment ended with ' + data.status)
              }
            }
            throw new Error('Timed out waiting for Pages deployment ' + deploymentId)
