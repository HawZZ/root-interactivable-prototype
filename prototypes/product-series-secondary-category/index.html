          body: "交互：选择本地图片后仅在前端预览，可替换或移除；系列图必填。\n状态：失败后保留已载入预览；不会在原型中上传文件。\n待确认：尺寸、比例、格式和文件大小限制待素材规范登记。\n原型备注：现有系列使用明确标注的辅助示意占位图，不虚构实物或铭牌位置。"
        },
        {
          id: "form-products", spec: "series-product-links", title: "同分类产品与唯一归属", target: '[data-note-target="form-products"]', loc: "配置表单 > 关联产品",
          body: "交互：只展示同分类产品，可按型号、名称、ID、App 搜索并多选。\n规则：被其他系列占用的产品保留展示但禁选，并说明占用系列；新建至少选择 1 个，编辑可清空。\n样本：BM04、BM04S 同属 Baby monitor；BM04M 不是可选产品；所有产品及系列 ID 均为 DEMO_ 前缀。\n服务端：同分类与 productId 唯一约束必须由接口和事务强校验，原型只做本地模拟；联调待验。"
        },
        {
          id: "form-demo", spec: "series-save-simulation", title: "保存与并发模拟", target: '[data-note-target="form-demo"]', loc: "配置表单 > 原型演示",
          body: "说明：可模拟保存失败、revision 冲突、重复入口文案。\n状态图：空闲 → 保存中 → 成功/失败/冲突。\n失败：保留全部输入并允许重试；冲突：提供刷新最新 revision 的动作，刷新前二次确认。\n原型备注：以上均为前端状态模拟，不代表服务端并发、数据库约束或接口已经通过。"
        },
        {
          id: "form-footer", spec: "series-save-actions", title: "底部操作、权限与结果", target: '[data-note-target="drawer-footer"]', loc: "配置表单 > 底部操作",
          body: "按钮：取消、保存；保存中按钮显示 loading 并禁用重复提交。\n成功：关闭当前表单并展示结果，提示同步更新配置及全部关联。\n失败：抽屉保持打开、输入不丢；冲突提供刷新。\n权限：只读模式下保存不可用。保存中统一拦截关闭、返回、遮罩和浏览器路由离开；异步结果返回后先校验当前路由与表单快照，避免取消后继续落盘。"
        }
      ];
      if (state.modal) return modalNotes();
      return notes;
    }

    function modalNotes() {
      const type = state.modal?.type;
      if (type === "categoryForm") {
        return [{
          id: "modal-category-form", spec: "modal-category-crud", title: "一级分类原有表单边界", target: '[data-note-target="modal"]', loc: "产品分类弹窗",
          body: "说明：演示现有类型名称（0/32）与产品分类编码字段。\nPRD 边界：字段和校验沿用现状，本需求未重定义一级分类规则。\n交互：取消关闭；确定提交。原型未连接真实服务。"
        }];
      }
      if (type === "categoryBlocked" || type === "categoryDelete") {
        return [{
          id: "modal-category-delete", spec: "modal-parent-delete-guard", title: "父分类删除保护", target: '[data-note-target="modal"]', loc: "删除产品分类弹窗",
          body: "规则：一级分类下仍有二级分类时禁止删除；移除全部二级分类后才可进入删除确认。\n状态/差异：阻断弹窗提供进入二级分类的入口；普通删除仍需确认。\n服务端边界：真实级联与并发检查待技术与联调验证。"
        }];
      }
      if (type === "seriesBlocked" || type === "seriesDelete") {
        return [{
          id: "modal-series-delete", spec: "modal-series-delete-guard", title: "系列删除保护", target: '[data-note-target="modal"]', loc: "删除二级分类弹窗",
          body: "规则：有关联产品时禁止删除，并提示先解除全部关联；无关联时展示确认弹窗。\n交互：阻断状态可直接进入编辑；空系列确认后删除。删除失败时系列仍保留，可原地重试。\n原型备注：演示结果不代表真实删除事务或权限校验已实现。"
        }];
      }
      if (type === "unsaved") {
        return [{
          id: "modal-unsaved", spec: "modal-unsaved-guard", title: "未保存离开确认", target: '[data-note-target="modal"]', loc: "配置抽屉 > 离开确认",
          body: "触发：编辑或新建已有字段修改时，点击取消、返回或关闭。\n交互：“继续编辑”回到原表单并保留输入；“放弃修改”离开。\n状态：只对变更后的表单触发。"
        }];
      }
      if (type === "refreshConflict") {
        return [{
          id: "modal-refresh", spec: "modal-revision-refresh", title: "revision 冲突刷新", target: '[data-note-target="modal"]', loc: "冲突恢复弹窗",
          body: "触发：并发冲突后点击“刷新最新数据”。\n交互：刷新前确认；确认后加载最新 revision，并覆盖当前未保存输入。\n服务端边界：真实冲突检测、刷新和重试由技术接口联调验证。"
        }];
      }
      return [];
    }

    function annotationContextLabel() {
      if (state.modal) {
        const labels = {
          categoryForm: "一级分类表单弹窗",
          categoryBlocked: "父分类删除阻断",
          categoryDelete: "父分类删除确认",
          seriesBlocked: "系列删除阻断",
          seriesDelete: "系列删除确认",
          unsaved: "未保存离开确认",
          refreshConflict: "revision 冲突刷新"
        };
        return labels[state.modal.type] || "当前弹窗";
      }
      return `${ROUTE_TITLES[state.route.page]} · ${location.hash || "#categories"}`;
    }

    function renderNoteBody(body) {
      const lines = String(body || "").split("\n").map((line) => line.trim()).filter(Boolean);
      return `<span class="note-body">${lines.map((line) => {
        const ordered = line.match(/^(\d+)\.\s+(.+)$/);
        if (/^(流程图|状态图|路径)[:：]/.test(line) || line.includes("→")) {
          return `<span class="note-flow">${esc(line)}</span>`;
        }
        if (line.endsWith("：") || line.endsWith(":")) {
          return `<strong class="note-section">${esc(line.replace(/[:：]$/, ""))}</strong>`;
        }
        if (line.startsWith("- ")) {
          return `<span class="note-line"><span class="note-marker">•</span><span>${esc(line.slice(2))}</span></span>`;
        }
        if (ordered) {
          return `<span class="note-line"><span class="note-marker">${esc(ordered[1])}.</span><span>${esc(ordered[2])}</span></span>`;
        }
        return `<span class="note-line plain">${esc(line)}</span>`;
      }).join("")}</span>`;
    }

    function clearAnnotationAnchors() {
      $$(".note-anchor").forEach((anchor) => anchor.remove());
      $$(".note-target-host").forEach((target) => target.classList.remove("note-target-host"));
      $$(".note-target-active").forEach((target) => target.classList.remove("note-target-active"));
    }

    function noteTarget(selector) {
      return document.querySelector(selector);
    }

    function activateNote(id, options = {}) {
      const notes = notesForContext();
      if (!notes.some((note) => note.id === id)) return;
      state.activeNoteId = id;
      $$(".note-card").forEach((card) => card.classList.toggle("active", card.dataset.noteId === id));
      $$(".note-target-active").forEach((target) => target.classList.remove("note-target-active"));
      const note = notes.find((item) => item.id === id);
      const target = note ? noteTarget(note.target) : null;
      if (!target) return;
      target.classList.add("note-target-active");
      if (window.matchMedia("(max-width: 900px)").matches && state.mobileTab !== "product") {
        state.mobileTab = "product";
        renderMobileTabs();
      }
      if (options.scroll !== false) {
        requestAnimationFrame(() => target.scrollIntoView({ block: "center", inline: "nearest", behavior: "smooth" }));
      }
    }

    function renderAnnotations() {
      const list = $("#annotationList");
      const context = $("#annotationContext");
      if (!list || !context) return;
      clearAnnotationAnchors();
      const notes = notesForContext();
      context.textContent = `当前：${annotationContextLabel()}`;
      if (!notes.length) {
        list.innerHTML = `<div class="note-empty">当前上下文没有单独批注。切换页面、状态或弹窗后会同步更新。</div>`;
        state.activeNoteId = null;
        return;
      }
      if (!notes.some((note) => note.id === state.activeNoteId)) state.activeNoteId = notes[0].id;
      list.innerHTML = notes.map((note, index) => `
        <button class="note-card ${note.id === state.activeNoteId ? "active" : ""}" type="button" data-note-id="${esc(note.id)}" id="spec-${esc(note.spec)}" aria-label="定位批注 ${index + 1}：${esc(note.title)}">
          <span class="note-number">${index + 1}</span>
          <span class="note-copy">
            <strong>${esc(note.title)}</strong>
            <span class="note-spec">ID: spec-${esc(note.spec)}</span>
            ${renderNoteBody(note.body)}
            <span class="note-location">关联位置：${esc(note.loc)}</span>
          </span>
        </button>`).join("");
      notes.forEach((note, index) => {
        const target = noteTarget(note.target);
        if (!target) return;
        target.classList.add("note-target-host");
        const anchor = document.createElement("button");
        anchor.type = "button";
        anchor.className = "note-anchor";
        anchor.textContent = String(index + 1);
        anchor.setAttribute("aria-label", `查看批注 ${index + 1}：${note.title}`);
        anchor.addEventListener("click", (event) => {
          event.preventDefault();
          event.stopPropagation();
          activateNote(note.id, { scroll: true });
          const card = document.getElementById(`spec-${note.spec}`);
          if (card) {
            state.mobileTab = "annotations";
            renderMobileTabs();
            requestAnimationFrame(() => card.scrollIntoView({ block: "center", behavior: "smooth" }));
          }
        });
        target.appendChild(anchor);
      });
      $$(".note-card").forEach((card) => card.addEventListener("click", () => activateNote(card.dataset.noteId)));
      const activeTarget = noteTarget(notes.find((note) => note.id === state.activeNoteId)?.target);
      if (activeTarget) activeTarget.classList.add("note-target-active");
    }
    function showToast(message, type = "success") {
      const stack = $("#toastStack");
      if (!stack) return;
      const toast = document.createElement("div");
      toast.className = `toast ${type}`;
      toast.innerHTML = `<span>${esc(message)}</span>`;
      stack.appendChild(toast);
      window.setTimeout(() => toast.remove(), 3600);
    }

    function navigateInContext(page, params = {}) {
      const next = { ...params };
      const preserveDemo = state.demo === "readonly" && page !== "categories";
      if (preserveDemo) next.demo = state.demo;
      navigate(page, next);
    }

    function goSeriesList() {
      const category = currentDrawerCategory();
      leaveFormOrRun(() => navigateInContext("series", { category: category?.id || DEFAULT_CATEGORY_ID }));
    }

    function leaveFormOrRun(callback) {
      if (state.formDirty && (state.route.page === "edit" || state.route.page === "create")) {
        state.pendingLeave = callback;
        state.modal = { type: "unsaved" };
        renderOverlay();
        renderAnnotations();
      } else {
        callback();
      }
    }

    function openSeries(categoryId) {
      navigateInContext("series", { category: categoryId });
    }

    function openCategoryForm(mode, categoryId = "") {
      if (isReadonly()) return;
      const category = categoryId ? getCategory(categoryId) : null;
      state.modal = {
        type: "categoryForm",
        mode,
        categoryId,
        draft: {
          name: category?.name || "",
          code: category?.code ?? ""
        },
        errorField: ""
      };
      renderOverlay();
      renderAnnotations();
    }

    function requestDeleteCategory(categoryId) {
      if (isReadonly()) return;
      const category = getCategory(categoryId);
      if (!category) return;
      if (seriesForCategory(categoryId).length) {
        state.modal = { type: "categoryBlocked", categoryId };
      } else {
        state.modal = { type: "categoryDelete", categoryId };
      }
      renderOverlay();
      renderAnnotations();
    }

    function saveCategoryModal() {
      const modal = state.modal;
      if (!modal || modal.type !== "categoryForm") return;
      const name = String(modal.draft.name || "").trim();
      const code = String(modal.draft.code || "").trim();
      if (!name) {
        state.modal.errorField = "name";
        renderOverlay();
        renderAnnotations();
        return;
      }
      if (!code) {
        state.modal.errorField = "code";
        renderOverlay();
        renderAnnotations();
        return;
      }
      const now = formatTimestamp();
      if (modal.mode === "edit") {
        const category = getCategory(modal.categoryId);
        if (!category) return;
        category.name = name;
        category.code = Number(code);
        category.updatedAt = now;
        state.modal = null;
        renderAll();
        showToast("产品分类已更新");
      } else {
        db.categories.unshift({
          id: `DEMO_CAT_${Date.now().toString(36).toUpperCase()}`,
          name,
          code: Number(code),
          createdAt: now,
          updatedAt: now
        });
        state.modal = null;
        renderAll();
        showToast("产品分类已创建");
      }
    }

    function requestDeleteSeries(seriesId) {
      if (isReadonly()) return;
      const series = getSeries(seriesId);
      if (!series) return;
      state.simulateDeleteFailure = false;
      state.modal = series.productIds.length
        ? { type: "seriesBlocked", seriesId }
        : { type: "seriesDelete", seriesId };
      renderOverlay();
      renderAnnotations();
    }

    function resetDemoData() {
      db = seedData();
      state.categoryQuery = "";
      state.seriesQuery = "";
      state.productQuery = "";
      state.form = null;
      state.formKey = "";
      state.formDirty = false;
      state.formErrors = {};
      state.saveError = null;
      state.saveStatus = "idle";
      state.modal = null;
      state.simulateFailure = false;
      state.conflictVersion = null;
      state.activeLocale = DEFAULT_LOCALE;
      navigate("categories", {});
      showToast("已恢复演示数据", "warning");
    }

    function updateDuplicateHost() {
      const host = $("#duplicateAlertHost");
      if (!host) return;
      const duplicate = duplicateEntryForForm();
      host.innerHTML = duplicate
        ? `<div class="notice warning duplicate-alert" data-note-target="duplicate-alert"><strong>重复入口文案提醒：</strong>同分类已有“${esc(seriesDefaultEntry(duplicate))}”。该提醒不阻断保存；请通过系列 ID 区分记录。</div>`
        : "";
    }

    function filterProductOptions() {
      const query = normalize(state.productQuery);
      let visible = 0;
      $$(".product-option").forEach((option) => {
        const haystack = option.dataset.productSearch || "";
        const show = !query || haystack.includes(query);
        option.classList.toggle("visually-hidden", !show);
        if (show) visible += 1;
      });
      const empty = $("#pickerFilterEmpty");
      if (empty) empty.style.display = visible ? "none" : "block";
    }

    function updateSeriesSearchResults() {
      const category = currentDrawerCategory();
      if (!category) return;
      const series = seriesForCategory(category.id).filter((item) => {
        const query = normalize(state.seriesQuery);
        if (!query) return true;
        return normalize(seriesDefaultEntry(item)).includes(query) || normalize(item.id).includes(query);
      });
      const tableWrap = $('[data-note-target="series-table"]');
      if (tableWrap) tableWrap.innerHTML = renderSeriesListState(category, series, state.demo, isReadonly());
      const count = $('#seriesResultCount');
      if (count) count.textContent = `匹配 ${series.length} 个系列`;
      renderAnnotations();
    }

    function validateSeriesForm() {
      if (!state.form) return false;
      const errors = {};
      const defaultCopy = state.form.i18n?.[DEFAULT_LOCALE] || {};
      if (!String(defaultCopy.entry || "").trim()) errors.entry = "请输入英语入口文案（默认语言）";
      if (!String(defaultCopy.title || "").trim()) errors.title = "请输入英语主要标题（默认语言）";
      if (!String(defaultCopy.content || "").trim()) errors.content = "请输入英语内容（默认语言）";
      if (!state.form.image && !state.form.imagePlaceholder) errors.image = "请选择系列图";
      if (state.route.page === "create" && state.form.productIds.length < 1) errors.products = "新建二级分类时至少关联 1 个产品";
      state.formErrors = errors;
      if (Object.keys(errors).length && (errors.entry || errors.title || errors.content)) state.activeLocale = DEFAULT_LOCALE;
      return Object.keys(errors).length === 0;
    }

    function serverRelationError(form) {
      for (const productId of form.productIds) {
        const product = getProduct(productId);
        if (!product) return "所选产品不存在，请刷新后重试";
        if (product.categoryId !== form.categoryId) return "所选产品不属于当前一级分类，请刷新后重试";
        const owner = productSeries(productId);
        if (owner && owner.id !== form.id) return `产品 ${product.model} 已被“${seriesDefaultEntry(owner)}”关联，请刷新后重试`;
      }
      return "";
    }

    async function saveSeriesForm() {
      if (!state.form || state.saveStatus === "saving" || isReadonly()) return;
      if (!validateSeriesForm()) {
        state.saveError = null;
        renderAll();
        const firstError = $(".has-error .input, .has-error .textarea, .has-error .image-upload");
        if (firstError) firstError.scrollIntoView({ block: "center", behavior: "smooth" });
        return;
      }
      const relationError = serverRelationError(state.form);
      if (relationError) {
        state.formErrors.products = relationError;
        renderAll();
        return;
      }
      state.saveStatus = "saving";
      state.saveError = null;
      renderOverlay();
      renderAnnotations();
      const saveToken = ++state.saveToken;
      const routePageAtSave = state.route.page;
      const formIdAtSave = state.form.id;
      const categoryIdAtSave = state.form.categoryId;
      const editing = routePageAtSave === "edit";
      const seriesId = formIdAtSave;
      const current = editing ? getSeries(seriesId) : null;
      await new Promise((resolve) => window.setTimeout(resolve, 720));

      const saveStillCurrent =
        state.saveToken === saveToken &&
        state.saveStatus === "saving" &&
        state.form &&
        state.route.page === routePageAtSave &&
        state.form.id === formIdAtSave &&
        state.form.categoryId === categoryIdAtSave;
      if (!saveStillCurrent) return;

      const shouldFail = state.simulateFailure || state.demo === "save-error";
      const conflict = editing && state.conflictVersion !== null && current && state.conflictVersion !== current.revision;
      if (shouldFail) {
        state.simulateFailure = false;
        if (state.demo === "save-error") {
          state.demo = "normal";
          state.route.params.delete("demo");
          history.replaceState(null, "", routeHash(state.route.page, Object.fromEntries(state.route.params.entries())));
        }
        state.saveStatus = "idle";
        state.saveError = { type: "network", message: "保存服务暂时不可用，已保留当前输入。请稍后重试。" };
        renderAll();
        return;
      }
      if (conflict) {
        state.saveStatus = "idle";
        state.saveError = { type: "conflict", message: `提交 revision ${state.conflictVersion} 时，该系列已更新到 revision ${current.revision}。请刷新最新数据后重新编辑。` };
        renderAll();
        return;
      }

      const now = formatTimestamp();
      if (editing && current) {
        const nextRevision = Math.max(current.revision, Number(state.form.revision) || 0) + 1;
        Object.assign(current, {
          image: state.form.image,
          imagePlaceholder: state.form.imagePlaceholder,
          i18n: clone(state.form.i18n),
          productIds: clone(state.form.productIds),
          revision: nextRevision,
          updatedAt: now
        });
      } else {
        const newId = `DEMO_SERIES_${Date.now().toString(36).toUpperCase()}`;
        db.series.unshift({
          id: newId,
          categoryId: state.form.categoryId,
          revision: 1,
          image: state.form.image,
          imagePlaceholder: state.form.imagePlaceholder,
          createdAt: now,
          updatedAt: now,
          i18n: clone(state.form.i18n),
          productIds: clone(state.form.productIds)
        });
        state.form.id = newId;
      }
      const savedId = state.form.id;
      const duplicate = duplicateEntryForForm();
      state.saveStatus = "idle";
      state.formDirty = false;
      state.saveError = null;
      state.conflictVersion = null;
      const categoryId = state.form.categoryId;
      const lang = state.activeLocale;
      navigate("view", { series: savedId, lang, saved: "1" });
      showToast(duplicate ? "保存成功；已提示同分类重复入口文案" : "保存成功，系列配置与关联产品已同步更新");
      state.demo = "normal";
      void categoryId;
    }

    async function refreshConflictAndEdit() {
      const seriesId = state.route.params.get("series");
      const series = getSeries(seriesId);
      if (!series) return;
      state.demo = "normal";
      state.route.params.delete("demo");
      history.replaceState(null, "", routeHash(state.route.page, Object.fromEntries(state.route.params.entries())));
      state.modal = null;
      initializeEditForm(seriesId);
      state.activeLocale = DEFAULT_LOCALE;
      renderAll();
      showToast(`已加载 latest revision ${series.revision}，请重新编辑`, "warning");
    }

    function handleAction(action, element) {
      const navigationActions = new Set([
        "open-series", "open-series-from-block", "close-drawer", "drawer-scrim", "drawer-back",
        "go-series-list", "open-series-create", "view-series", "edit-series", "cancel-form"
      ]);
      if (state.saveStatus === "saving" && navigationActions.has(action)) {
        showToast("正在保存，请等待完成", "warning");
        return;
      }
      switch (action) {
        case "open-category-create":
          openCategoryForm("create");
          break;
        case "edit-category":
          openCategoryForm("edit", element.dataset.categoryId);
          break;
        case "delete-category":
          requestDeleteCategory(element.dataset.categoryId);
          break;
        case "save-category":
          saveCategoryModal();
          break;
        case "confirm-delete-category": {
          if (isReadonly()) return;
          const category = getCategory(element.dataset.categoryId);
          if (category && !seriesForCategory(category.id).length) {
            db.categories = db.categories.filter((item) => item.id !== category.id);
            state.modal = null;
            renderAll();
            showToast("产品分类已删除");
          }
          break;
        }
        case "open-series":
          openSeries(element.dataset.categoryId);
          break;
        case "open-series-from-block":
          state.modal = null;
          openSeries(element.dataset.categoryId);
          break;
        case "close-drawer":
          leaveFormOrRun(() => navigate("categories", {}));
          break;
        case "drawer-scrim":
          leaveFormOrRun(() => navigate("categories", {}));
          break;
        case "drawer-back":
          goSeriesList();
          break;
        case "go-series-list":
          goSeriesList();
          break;
        case "open-series-create": {
          if (isReadonly()) return;
          const category = currentDrawerCategory();
          navigateInContext("create", { category: category?.id || DEFAULT_CATEGORY_ID });
          break;
        }
        case "view-series":
          navigateInContext("view", { series: element.dataset.seriesId });
          break;
        case "edit-series":
          if (isReadonly()) return;
          navigateInContext("edit", { series: element.dataset.seriesId });
          break;
        case "delete-series":
          requestDeleteSeries(element.dataset.seriesId);
          break;
        case "confirm-delete-series": {
          if (isReadonly()) return;
          const series = getSeries(element.dataset.seriesId);
          if (series && !series.productIds.length) {
            if (state.simulateDeleteFailure) {
              state.simulateDeleteFailure = false;
              state.modal.error = "删除服务暂时不可用，未移除任何配置。";
              renderOverlay();
              renderAnnotations();
              break;
            }
            const categoryId = series.categoryId;
            db.series = db.series.filter((item) => item.id !== series.id);
            state.modal = null;
            navigateInContext("series", { category: categoryId });
            showToast("二级分类已删除");
          }
          break;
        }
        case "simulate-delete-failure":
          state.simulateDeleteFailure = true;
          renderOverlay();
          renderAnnotations();
          break;
        case "cancel-form":
        case "request-back":
          leaveFormOrRun(() => {
            const category = currentDrawerCategory();
            navigate("series", { category: category?.id || DEFAULT_CATEGORY_ID });
          });
          break;
        case "save-series":
          saveSeriesForm();
          break;
        case "retry-save":
          state.saveError = null;
          saveSeriesForm();
          break;
        case "dismiss-save-error":
          state.saveError = null;
          renderAll();
          break;
        case "refresh-conflict":
          state.modal = { type: "refreshConflict" };
          renderOverlay();
          renderAnnotations();
          break;
        case "confirm-refresh-conflict":
          refreshConflictAndEdit();
          break;
        case "dismiss-unsaved":
          state.modal = null;
          state.pendingLeave = null;
          renderOverlay();
          renderAnnotations();
          break;
        case "discard-unsaved": {
          const callback = state.pendingLeave;
          state.modal = null;
          state.pendingLeave = null;
          state.formDirty = false;
          if (callback) callback();
          break;
        }
        case "retry-category":
          state.demo = "normal";
          replaceRoute("categories", { demo: undefined });
          break;
        case "retry-series":
          state.demo = "normal";
          replaceRoute("series", { demo: undefined, category: currentDrawerCategory()?.id || DEFAULT_CATEGORY_ID });
          break;
        case "reset-series-query":
          state.seriesQuery = "";
          updateSeriesSearchResults();
          break;
        case "select-locale": {
          const locale = element.dataset.locale;
          state.activeLocale = locale;
          replaceRoute(state.route.page, { lang: locale });
          break;
        }
        case "remove-series-image":
          if (isReadonly()) return;
          state.form.image = "";
          state.form.imagePlaceholder = false;
          state.imageFileName = "";
          markFormDirty();
          renderAll();
          break;
        case "simulate-save-failure":
          state.simulateFailure = true;
          renderOverlay();
          renderAnnotations();
          break;
        case "simulate-conflict": {
          const current = getSeries(state.form?.id);
          if (!current) return;
          state.conflictVersion = Math.max(1, current.revision - 1);
          renderOverlay();
          renderAnnotations();
          showToast("已模拟 revision 冲突：下一次保存将失败", "warning");
          break;
        }
        case "fill-duplicate":
          if (!state.form) return;
          state.form.i18n[DEFAULT_LOCALE].entry = seriesDefaultEntry(getSeries(DEFAULT_SERIES_ID));
          state.activeLocale = DEFAULT_LOCALE;
          markFormDirty();
          renderAll();
          break;
        case "reset-demo":
          resetDemoData();
          break;
        case "close-modal":
          if (state.modal?.type === "seriesDelete") state.simulateDeleteFailure = false;
          state.modal = null;
          state.pendingLeave = null;
          renderOverlay();
          renderAnnotations();
          break;
        case "modal-scrim":
          if (state.modal?.type === "seriesDelete") state.simulateDeleteFailure = false;
          state.modal = null;
          state.pendingLeave = null;
          renderOverlay();
          renderAnnotations();
          break;
        default:
          break;
      }
    }

    document.addEventListener("click", (event) => {
      const mobileTab = event.target.closest("[data-mobile-tab]");
      if (mobileTab) {
        state.mobileTab = mobileTab.dataset.mobileTab;
        renderMobileTabs();
        return;
      }
      const actionElement = event.target.closest("[data-action]");
      if (!actionElement) return;
      const action = actionElement.dataset.action;
      if (actionElement.disabled) return;
      if (action === "modal-scrim" && event.target !== actionElement) return;
      if (action === "drawer-scrim" && event.target !== actionElement) return;
      handleAction(action, actionElement);
    });

    document.addEventListener("input", (event) => {
      const target = event.target;
      if (target.id === "seriesSearchInput") {
        state.seriesQuery = target.value;
        updateSeriesSearchResults();
        return;
      }
      if (target.id === "productSearchInput") {
        state.productQuery = target.value;
        filterProductOptions();
        return;
      }
      if (target.matches("[data-form-field]")) {
        if (!state.form || isReadonly()) return;
        const field = target.dataset.formField;
        if (!state.form.i18n[state.activeLocale]) state.form.i18n[state.activeLocale] = { entry: "", title: "", content: "" };
        state.form.i18n[state.activeLocale][field] = target.value;
        markFormDirty();
        if (field === "entry" && state.activeLocale === DEFAULT_LOCALE) updateDuplicateHost();
        return;
      }
      if (target.matches("[data-category-field]")) {
        if (!state.modal || state.modal.type !== "categoryForm") return;
        state.modal.draft[target.dataset.categoryField] = target.value;
      }
    });

    document.addEventListener("change", (event) => {
      const target = event.target;
      if (target.matches("[data-locale-select]")) {
        if (state.saveStatus === "saving") return;
        state.activeLocale = target.value;
        replaceRoute(state.route.page, { lang: target.value });
        return;
      }
      if (target.matches("[data-demo-select]")) {
        const context = target.dataset.demoSelect;
        const value = target.value;
        state.demo = value;
        if (context === "category") {
          replaceRoute("categories", { demo: value === "normal" ? undefined : value });
        } else {
          const category = currentDrawerCategory();
          replaceRoute("series", { category: category?.id || DEFAULT_CATEGORY_ID, demo: value === "normal" ? undefined : value });
        }
        return;
      }
      if (target.matches("[data-product-id]")) {
        if (!state.form || isReadonly() || state.saveStatus === "saving") return;
        const productId = target.dataset.productId;
        const owner = productSeries(productId);
        if (owner && owner.id !== state.form.id) {
          target.checked = false;
          showToast(`该产品已被「${seriesDefaultEntry(owner)}」关联`, "warning");
          return;
        }
        if (target.checked) {
          if (!state.form.productIds.includes(productId)) state.form.productIds.push(productId);
        } else {
          state.form.productIds = state.form.productIds.filter((id) => id !== productId);
        }
        markFormDirty();
        target.closest(".product-option")?.classList.toggle("selected", target.checked);
        const summary = document.querySelector(".picker-summary");
        if (summary) summary.textContent = `已选 ${state.form.productIds.length} 个`;
        return;
      }
      if (target.id === "seriesImageInput") {
        if (!target.files || !target.files[0] || !state.form || isReadonly()) return;
        const file = target.files[0];
        const reader = new FileReader();
        reader.onload = () => {
          state.form.image = String(reader.result || "");
          state.form.imagePlaceholder = false;
          state.imageFileName = file.name;
          markFormDirty();
          renderAll();
        };
        reader.readAsDataURL(file);
      }
    });

    window.addEventListener("hashchange", syncFromHash);
    window.addEventListener("popstate", syncFromHash);
    if (!location.hash) history.replaceState(null, "", "#categories");
    syncFromHash();
  </script>
</body>
</html>
