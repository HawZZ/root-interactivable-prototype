<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="IoT Admin 产品二级分类配置可交互原型">
  <title>IoT Admin · 产品二级分类原型</title>
  <style>
    :root {
      color-scheme: light;
      --nav: #001529;
      --nav-active: #0b2a4a;
      --primary: #4372ff;
      --primary-dark: #2b6bd9;
      --primary-light: #ecf5ff;
      --success: #67c23a;
      --warning: #e6a23c;
      --danger: #f56c6c;
      --info: #909399;
      --text: #303133;
      --text-regular: #606266;
      --text-secondary: #909399;
      --placeholder: #a8abb2;
      --border: #dcdfe6;
      --border-light: #e4e7ed;
      --border-lighter: #ebeef5;
      --page-bg: #f5f6f8;
      --white: #fff;
      --header-h: 54px;
      --aside-w: 208px;
      --annotation-w: 392px;
      --radius: 4px;
      --sans: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      overflow: hidden;
      color: var(--text);
      background: #eef0f3;
      font-family: var(--sans);
      font-size: 14px;
      line-height: 1.5;
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; }
    svg { display: block; }
    .workspace {
      height: 100vh;
      display: grid;
      grid-template-columns: minmax(0, 1fr) var(--annotation-w);
      grid-template-rows: minmax(0, 1fr);
      overflow: hidden;
    }
    .mobile-tabs { display: none; }
    .product-pane {
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background:
        linear-gradient(90deg, rgba(67, 114, 255, .025) 1px, transparent 1px),
        linear-gradient(rgba(67, 114, 255, .025) 1px, transparent 1px),
        #eef1f4;
      background-size: 24px 24px;
    }
    .canvas-scroll {
      width: 100%;
      height: 100%;
      overflow: auto;
      padding: 18px;
      overscroll-behavior: contain;
    }
    .product-canvas {
      width: 1440px;
      min-height: calc(100vh - 36px);
      margin: 0 auto;
      background: var(--white);
      border: 1px solid #d9dee7;
      box-shadow: 0 10px 30px rgba(16, 32, 56, .08);
    }
    .admin-app {
      width: 100%;
      min-height: calc(100vh - 36px);
      display: grid;
      grid-template-columns: var(--aside-w) minmax(0, 1fr);
      background: var(--page-bg);
    }
    .sidebar {
      min-height: calc(100vh - 36px);
      background: var(--nav);
      color: rgba(255, 255, 255, .76);
      display: flex;
      flex-direction: column;
    }
    .brand {
      height: 64px;
      padding: 0 16px;
      border-bottom: 1px solid rgba(255, 255, 255, .08);
      display: flex;
      align-items: center;
      gap: 10px;
      color: #fff;
    }
    .brand-mark {
      width: 30px;
      height: 30px;
      border-radius: 4px;
      background: #85b436;
      display: grid;
      place-items: center;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: -.3px;
    }
    .brand-name { font-size: 15px; font-weight: 700; line-height: 19px; }
    .brand-sub { color: rgba(255, 255, 255, .5); font-size: 11px; line-height: 15px; }
    .nav-list { padding: 8px 0 24px; }
    .nav-item, .nav-group {
      min-height: 42px;
      padding: 0 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
    }
    .nav-item { color: rgba(255, 255, 255, .74); border-left: 3px solid transparent; }
    .nav-item:hover { background: rgba(67, 114, 255, .1); color: #fff; }
    .nav-item.active {
      background: var(--nav-active);
      border-left-color: var(--primary);
      color: #fff;
    }
    .nav-group {
      min-height: 36px;
      margin-top: 4px;
      color: rgba(255, 255, 255, .42);
      font-size: 12px;
    }
    .nav-icon {
      width: 15px;
      height: 15px;
      border: 1px solid currentColor;
      border-radius: 3px;
      display: grid;
      place-items: center;
      font-size: 9px;
      opacity: .82;
      flex: 0 0 auto;
    }
    .admin-main {
      min-width: 0;
      min-height: calc(100vh - 36px);
      display: grid;
      grid-template-rows: var(--header-h) minmax(0, 1fr);
      background: var(--page-bg);
    }
    .topbar {
      height: var(--header-h);
      padding: 0 24px;
      background: #fff;
      box-shadow: rgba(0, 0, 0, .06) 0 -1px 0 0 inset;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      position: relative;
    }
    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-secondary);
      font-size: 12px;
      min-width: 0;
    }
    .breadcrumb strong { color: var(--text); font-weight: 500; }
    .userbar { display: flex; align-items: center; gap: 10px; white-space: nowrap; color: var(--text-regular); }
    .avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--primary-light);
      color: var(--primary);
      font-weight: 700;
    }
    .page-content { min-width: 0; padding: 24px; }
    .page-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 16px;
    }
    .page-head h1 { margin: 0; font-size: 20px; line-height: 28px; font-weight: 600; }
    .page-desc { margin: 4px 0 0; color: var(--text-secondary); font-size: 13px; }
    .page-actions, .row-actions, .footer-actions, .toolbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .btn {
      min-height: 32px;
      padding: 5px 13px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: #fff;
      color: var(--text-regular);
      font-weight: 500;
      transition: border-color .15s ease, color .15s ease, background .15s ease;
    }
    .btn:hover:not(:disabled) { color: var(--primary); border-color: #a7c2ff; }
    .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
    .btn.primary:hover:not(:disabled) { background: var(--primary-dark); border-color: var(--primary-dark); }
    .btn.danger { color: var(--danger); border-color: #f4b6b6; background: #fff8f8; }
    .btn.danger:hover:not(:disabled) { color: #fff; background: var(--danger); border-color: var(--danger); }
    .btn.ghost { background: transparent; }
    .btn.icon { width: 32px; padding: 0; font-size: 20px; line-height: 28px; }
    .btn.sm { min-height: 28px; padding: 3px 9px; font-size: 13px; }
    .btn.text { min-height: 26px; padding: 2px 4px; border: 0; background: transparent; color: var(--primary); }
    .btn.text.danger-text { color: var(--danger); }
    .btn:disabled, .btn.disabled { color: #a8abb2; background: #f5f7fa; border-color: #e4e7ed; cursor: not-allowed; }
    .btn.primary:disabled { color: #fff; background: #a0b8ff; border-color: #a0b8ff; }
    .loading-label { display: inline-flex; align-items: center; gap: 6px; }
    .spinner {
      width: 12px;
      height: 12px;
      border: 2px solid rgba(255,255,255,.45);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .data-card, .filter-card, .form-card, .info-card {
      background: #fff;
      border: 1px solid var(--border-light);
      border-radius: var(--radius);
    }
    .filter-card {
      padding: 14px 16px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .filter-inline { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .filter-label { color: var(--text-regular); }
    .input, .select, .textarea {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: #fff;
      color: var(--text-regular);
      outline: 0;
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    .input, .select { height: 32px; padding: 4px 10px; }
    .textarea { width: 100%; min-height: 88px; padding: 7px 10px; resize: vertical; line-height: 1.65; }
    .input:focus, .select:focus, .textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(67, 114, 255, .1);
    }
    .input:disabled, .select:disabled, .textarea:disabled { background: #f5f7fa; color: #a8abb2; }
    .filter-input { width: 240px; }
    .data-card { overflow: hidden; }
    .data-card-head {
      min-height: 52px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      border-bottom: 1px solid var(--border-lighter);
    }
    .data-card-title { font-weight: 600; }
    .muted { color: var(--text-secondary); }
    .small { font-size: 12px; }
    .mono { font-family: var(--mono); font-size: 12px; }
    .table-wrap { overflow-x: auto; }
    table.data-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    .data-table th, .data-table td { padding: 11px 16px; border-bottom: 1px solid var(--border-lighter); text-align: left; vertical-align: middle; }
    .data-table th {
      color: var(--text-secondary);
      background: #fafafa;
      font-size: 13px;
      font-weight: 600;
    }
    .data-table tbody tr:hover { background: #fbfcff; }
    .data-table tbody tr:last-child td { border-bottom: 0; }
    .category-name { font-weight: 500; color: var(--text); }
    .category-meta { margin-top: 3px; color: var(--text-secondary); font-size: 12px; }
    .row-actions { gap: 12px; }
    .link-btn { border: 0; padding: 0; background: transparent; color: var(--primary); font-weight: 400; }
    .link-btn:hover:not(:disabled) { color: var(--primary-dark); text-decoration: underline; }
    .link-btn.danger-link { color: var(--danger); }
    .link-btn:disabled { color: #a8abb2; cursor: not-allowed; text-decoration: none; }
    .op-badge {
      display: inline-grid;
      min-width: 17px;
      height: 17px;
      padding: 0 4px;
      margin-left: 4px;
      place-items: center;
      border-radius: 9px;
      background: var(--primary-light);
      color: var(--primary);
      font-size: 11px;
      font-weight: 600;
    }
    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 1px 7px;
      border-radius: 3px;
      background: #f4f4f5;
      color: var(--text-secondary);
      font-size: 12px;
      line-height: 18px;
      white-space: nowrap;
    }
    .tag.primary { color: var(--primary); background: var(--primary-light); }
    .tag.success { color: #529b2e; background: #f0f9eb; }
    .tag.warning { color: #b57a25; background: #fdf6ec; }
    .tag.danger { color: #d74b4b; background: #fef0f0; }
    .pagination {
      min-height: 60px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      color: var(--text-regular);
      border-top: 1px solid var(--border-lighter);
    }
    .pager { display: flex; align-items: center; gap: 6px; }
    .pager button {
      width: 28px;
      height: 28px;
      border: 1px solid var(--border);
      border-radius: 3px;
      background: #fff;
      color: var(--text-regular);
    }
    .pager button.active { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }
    .demo-strip {
      position: relative;
      margin: 0 0 14px;
      padding: 9px 12px;
      border: 1px dashed #e5bf6a;
      border-radius: var(--radius);
      background: #fffaf0;
      color: #7d5b0e;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      font-size: 12px;
    }
    .demo-strip.compact { margin: 0; }
    .demo-kicker {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 700;
      color: #8a6508;
      white-space: nowrap;
    }
    .demo-kicker::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #e6a23c;
    }
    .demo-strip .select { height: 28px; padding: 2px 8px; border-color: #ebd291; background: #fffdf8; color: #75530b; }
    .demo-strip .btn { min-height: 28px; padding: 2px 9px; border-color: #e7cb86; color: #75530b; background: #fffdf8; }
    .demo-divider { width: 1px; height: 18px; background: #ecd495; }
    .assumption {
      display: inline-flex;
      align-items: center;
      min-height: 20px;
      padding: 1px 6px;
      border-radius: 3px;
      background: #fff4d6;
      color: #8a6508;
      font-size: 11px;
      white-space: nowrap;
    }
    .notice {
      padding: 9px 11px;
      border-radius: var(--radius);
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 13px;
      line-height: 20px;
    }
    .notice.info { background: var(--primary-light); color: #31589d; border: 1px solid #d8e6ff; }
    .notice.warning { background: #fdf6ec; color: #8a5a12; border: 1px solid #f5dfbd; }
    .notice.danger { background: #fef0f0; color: #a33b3b; border: 1px solid #f7d1d1; }
    .notice.success { background: #f0f9eb; color: #3f7d24; border: 1px solid #dcefd1; }
    .notice strong { font-weight: 600; }
    .empty-state, .error-state {
      min-height: 300px;
      padding: 44px 24px;
      display: grid;
      place-items: center;
      text-align: center;
    }
    .empty-graphic, .error-graphic {
      width: 62px;
      height: 48px;
      margin: 0 auto 12px;
      border: 1px dashed #c8ced8;
      border-radius: 8px;
      background: #fafbfc;
      display: grid;
      place-items: center;
      color: #a8abb2;
      font-size: 20px;
    }
    .empty-state h3, .error-state h3 { margin: 0 0 4px; font-size: 15px; }
    .empty-state p, .error-state p { margin: 0 0 14px; color: var(--text-secondary); font-size: 13px; }
    .skeleton {
      background: linear-gradient(90deg, #f2f4f7 25%, #f8f9fb 37%, #f2f4f7 63%);
      background-size: 400% 100%;
      animation: shimmer 1.3s ease infinite;
      border-radius: 3px;
    }
    @keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }
    .skeleton-row { height: 44px; display: grid; grid-template-columns: 2fr 1.2fr 1fr; gap: 24px; align-items: center; padding: 0 16px; border-bottom: 1px solid var(--border-lighter); }
    .skeleton-row span { height: 11px; }
    .modal-scrim, .drawer-scrim {
      position: absolute;
      inset: 0;
      z-index: 30;
      background: rgba(12, 22, 38, .44);
    }
    .drawer-scrim { z-index: 20; }
    .modal-scrim {
      z-index: 50;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .drawer {
      position: absolute;
      z-index: 24;
      top: 0;
      right: 0;
      width: min(720px, 100%);
      height: 100%;
      background: #fff;
      box-shadow: -14px 0 30px rgba(0, 0, 0, .14);
      display: grid;
      grid-template-rows: 56px minmax(0, 1fr) 64px;
    }
    .drawer-header {
      min-width: 0;
      padding: 0 18px 0 20px;
      border-bottom: 1px solid var(--border-lighter);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .drawer-title-wrap { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .drawer-title { margin: 0; font-size: 16px; font-weight: 600; line-height: 24px; white-space: nowrap; }
    .drawer-subtitle { color: var(--text-secondary); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .back-btn {
      width: 28px;
      height: 28px;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--text-regular);
      font-size: 20px;
      border-radius: 3px;
    }
    .back-btn:hover { background: #f5f7fa; }
    .drawer-body { min-height: 0; overflow: auto; padding: 18px 20px 24px; background: #fff; }
    .drawer-footer {
      min-height: 64px;
      padding: 0 20px;
      border-top: 1px solid var(--border-lighter);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      background: #fff;
    }
    .footer-note { color: var(--text-secondary); font-size: 12px; }
    .drawer-section-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
    .drawer-section-title { margin: 0; font-size: 16px; line-height: 24px; font-weight: 600; }
    .drawer-section-desc { margin: 4px 0 0; color: var(--text-secondary); font-size: 12px; line-height: 18px; }
    .series-toolbar {
      padding: 11px 12px;
      margin: 0 0 14px;
      border: 1px solid var(--border-light);
      border-radius: var(--radius);
      background: #fafbfc;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .series-toolbar .input { width: 240px; height: 30px; background: #fff; }
    .series-table-wrap { border: 1px solid var(--border-light); border-radius: var(--radius); overflow: hidden; }
    .series-table th, .series-table td { padding-top: 9px; padding-bottom: 9px; }
    .series-cell { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .series-thumb {
      width: 40px;
      height: 32px;
      border: 1px solid var(--border-light);
      border-radius: 3px;
      overflow: hidden;
      background: #f8fafc;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      color: #94a3b8;
      font-size: 11px;
    }
    .series-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .series-cell-copy { min-width: 0; }
    .series-cell-copy strong { display: block; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .series-cell-copy span { display: block; color: var(--text-secondary); font-size: 11px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .detail-hero {
      border: 1px solid var(--border-light);
      border-radius: var(--radius);
      padding: 16px;
      display: grid;
      grid-template-columns: 148px minmax(0, 1fr);
      gap: 16px;
      margin-bottom: 16px;
      background: #fff;
    }
    .series-image-large {
      width: 148px;
      height: 108px;
      border: 1px dashed #cfd6e2;
      border-radius: 4px;
      background: #f8fafc;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: #8b97a7;
      text-align: center;
      font-size: 11px;
      line-height: 17px;
    }
    .series-image-large img { width: 100%; height: 100%; object-fit: cover; }
    .detail-entry { margin: 1px 0 5px; font-size: 18px; font-weight: 600; line-height: 27px; }
    .detail-subtitle { margin: 0; color: var(--text-regular); line-height: 22px; }
    .detail-meta {
      margin-top: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      color: var(--text-secondary);
      font-size: 12px;
    }
    .language-switch { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; max-width: 100%; }
    .language-select { width: 230px; max-width: 100%; height: 32px; background: #fff; }
    .language-count { color: var(--text-secondary); font-size: 12px; white-space: nowrap; }
    .detail-section { margin-top: 16px; }
    .section-title-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
    .section-title { margin: 0; font-size: 14px; font-weight: 600; }
    .section-hint { color: var(--text-secondary); font-size: 12px; }
    .readonly-field {
      border: 1px solid var(--border-lighter);
      border-radius: var(--radius);
      padding: 12px 14px;
      background: #fbfcfd;
    }
    .readonly-label { color: var(--text-secondary); font-size: 12px; margin-bottom: 5px; }
    .readonly-value { color: var(--text); line-height: 22px; white-space: pre-wrap; }
    .readonly-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .association-table th, .association-table td { padding: 8px 12px; }
    .product-model { font-weight: 600; color: var(--text); }
    .product-name { margin-top: 2px; color: var(--text-secondary); font-size: 12px; }
    .product-row { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .product-icon {
      width: 34px;
      height: 28px;
      border: 1px solid var(--border-light);
      border-radius: 3px;
      display: grid;
      place-items: center;
      background: #f8fafc;
      color: #93a0b0;
      font-size: 10px;
      flex: 0 0 auto;
    }
    .form-identity {
      border: 1px solid var(--border-light);
      border-radius: var(--radius);
      background: #fafbfc;
      padding: 12px 14px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto;
      gap: 12px;
      margin-bottom: 16px;
    }
    .identity-item { min-width: 0; }
    .identity-label { color: var(--text-secondary); font-size: 11px; margin-bottom: 3px; }
    .identity-value { font-size: 13px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    let db = seedData();

    const state = {
      route: { page: "categories", params: new URLSearchParams() },

    const $ = (selector, root = document) => root.querySelector(selector);
    const $$ = (selector, root = document) => Array.from(root.querySelectorAll(selector));
    const clone = (value) => JSON.parse(JSON.stringify(value));
    const esc = (value = "") => String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
    const encode = (value) => encodeURIComponent(String(value));
    const normalize = (value = "") => String(value).trim().toLocaleLowerCase();

    function parseRoute() {
      const raw = location.hash.replace(/^#/, "") || "categories";
      const [rawPage, queryString = ""] = raw.split("?");
      const page = Object.prototype.hasOwnProperty.call(ROUTE_TITLES, rawPage) ? rawPage : "categories";
      return { page, params: new URLSearchParams(queryString) };
    }

    function routeHash(page, params = {}) {
      const search = new URLSearchParams();
      Object.entries(params).forEach(([key, value]) => {
        if (value !== undefined && value !== null && value !== "") search.set(key, value);
      });
      const query = search.toString();
      return `#${page}${query ? `?${query}` : ""}`;
    }

    function currentParamsObject() {
      return Object.fromEntries(state.route.params.entries());
    }

    function navigate(page, params = {}) {
      const target = routeHash(page, params);
      if (location.hash === target) {
        syncFromHash();
      } else {
        history.pushState(null, "", target);
        syncFromHash();
      }
    }

    function replaceRoute(page = state.route.page, patch = {}) {
      const params = { ...currentParamsObject(), ...patch };
      Object.keys(params).forEach((key) => {
        if (params[key] === undefined || params[key] === null || params[key] === "") delete params[key];
      });
      history.replaceState(null, "", routeHash(page, params));
      syncFromHash();
    }

    function syncFromHash() {
      state.saveToken = (state.saveToken || 0) + 1;
      state.route = parseRoute();
      state.demo = state.route.params.get("demo") || "normal";
      const requestedLocale = state.route.params.get("lang");
      const queryLocale = ({ "zh-CN": "zh", "zh-TW": "zh-Hant" })[requestedLocale] || requestedLocale;
      state.activeLocale = LOCALES.some((item) => item.id === queryLocale) ? queryLocale : DEFAULT_LOCALE;
      state.modal = null;
      state.saveError = null;
      state.saveStatus = "idle";

      const page = state.route.page;
      if (page === "edit" || page === "create") {
        const seriesId = state.route.params.get("series") || "";
        const categoryId = state.route.params.get("category") || DEFAULT_CATEGORY_ID;
        const formKey = `${page}:${categoryId}:${seriesId}`;
        if (state.formKey !== formKey || !state.form) {
          state.formKey = formKey;
          if (page === "edit") initializeEditForm(seriesId);
          else initializeCreateForm(categoryId);
        }
      } else {
        state.form = null;
        state.formKey = "";
        state.formDirty = false;
        state.formErrors = {};
      }

      renderAll();
      requestAnimationFrame(() => {
        const scroller = $("#canvasScroll");
        if (scroller) scroller.scrollTop = 0;
      });
    }

    function getCategory(id) {
      return db.categories.find((item) => item.id === id) || null;
    }

    function getSeries(id) {
      return db.series.find((item) => item.id === id) || null;
    }

    function getProduct(id) {
      return db.products.find((item) => item.id === id) || null;
    }

    function seriesForCategory(categoryId) {
      return db.series.filter((item) => item.categoryId === categoryId);
    }

    function productSeries(productId) {
      return db.series.find((item) => item.productIds.includes(productId)) || null;
    }

    function localeInfo(localeId) {
      return LOCALES.find((item) => item.id === localeId) || LOCALES[0];
    }

    function localeValue(series, localeId, field) {
      const item = series?.i18n?.[localeId] || {};
      return String(item[field] || "").trim();
    }

    function localeDisplay(series, localeId, field) {
      const direct = localeValue(series, localeId, field);
      if (direct) return { value: direct, fallback: false };
      return { value: localeValue(series, DEFAULT_LOCALE, field), fallback: true };
    }

    function localeCompleteness(source) {
      const values = source?.i18n?.[state.activeLocale] || {};
      const filled = ["entry", "title", "content"].filter((key) => String(values[key] || "").trim()).length;
      return { filled, complete: filled === 3 };
    }

    function seriesDefaultEntry(series) {
      return localeValue(series, DEFAULT_LOCALE, "entry");
    }

    function formatTimestamp(date = new Date()) {
      const pad = (n) => String(n).padStart(2, "0");
      return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`;
    }

    function duplicateEntryForForm() {
      if (!state.form) return null;
      const entry = String(state.form.i18n?.[DEFAULT_LOCALE]?.entry || "").trim();
      if (!entry) return null;
      return db.series.find((item) =>
        item.categoryId === state.form.categoryId &&
        item.id !== state.form.id &&
        normalize(seriesDefaultEntry(item)) === normalize(entry)
      ) || null;
    }

    function initializeEditForm(seriesId) {
      const series = getSeries(seriesId);
      if (!series) {
        state.form = null;

      }
      state.form = clone(series);

      state.formDirty = false;
      state.formErrors = {};
      state.saveError = null;
      state.saveStatus = "idle";
      state.conflictVersion = state.demo === "conflict" ? Math.max(1, series.revision - 1) : null;
      state.productQuery = "";

          <div class="drawer-body" id="drawerBody">${body}</div>
          <footer class="drawer-footer" data-note-target="drawer-footer">${footer}</footer>
        </aside>`;
    }

    function renderMissingSeries() {
      return `
        <div class="error-state">
          <div>
            <div class="error-graphic">!</div>
            <h3>没有找到这个演示系列</h3>
            <p>它可能已被删除，或链接中的系列 ID 无效。</p>
            <button class="btn primary" type="button" data-action="go-series-list">返回二级分类列表</button>
          </div>
        </div>`;
    }

    function renderSeriesList(category) {
      const scenario = state.demo;
      const readonly = scenario === "readonly";
      const series = seriesForCategory(category.id).filter((item) => {
        const query = normalize(state.seriesQuery);
        if (!query) return true;
        return normalize(seriesDefaultEntry(item)).includes(query) || normalize(item.id).includes(query);
      });
      return `
        ${demoSelect("series")}
        ${readonly ? `<div class="notice warning" style="margin-bottom:14px"><strong>只读权限：</strong>当前账号仅可查看及定位系列，无法新建、编辑或删除。</div>` : ""}
        <div class="drawer-section-head" data-note-target="series-create">
          <div>
            <h3 class="drawer-section-title">二级分类管理</h3>
            <p class="drawer-section-desc">所属一级分类固定为 ${esc(category.name)}（${esc(category.id)}）。这里的“二级分类”即平台侧的系列配置。</p>
          </div>
          <button class="btn primary" type="button" data-action="open-series-create" ${readonly || scenario === "loading" || scenario === "error" ? "disabled" : ""}>新建二级分类</button>
        </div>
        <div class="series-toolbar" data-note-target="series-toolbar">
          <div class="filter-inline">
            <span class="filter-label">搜索</span>
            <input class="input" id="seriesSearchInput" value="${esc(state.seriesQuery)}" placeholder="入口文案或系列 ID" aria-label="搜索二级分类">
          </div>
          <span class="muted small" id="seriesResultCount">同分类下共 ${seriesForCategory(category.id).length} 个系列</span>
        </div>
        <section class="series-table-wrap" data-note-target="series-table" aria-label="二级分类列表">
          ${renderSeriesListState(category, series, scenario, readonly)}
        </section>`;
    }

    function renderSeriesListState(category, series, scenario, readonly) {
      if (scenario === "loading") return loadingTable();
      if (scenario === "error") {
        return `
          <div class="error-state">
            <div>
              <div class="error-graphic">!</div>
              <h3>二级分类加载失败</h3>
              <p>请稍后重新加载。</p>
              <button class="btn primary" type="button" data-action="retry-series">重新加载</button>
            </div>
          </div>`;
      }
      if (scenario === "empty") {
        return `
          <div class="empty-state">
            <div>
              <div class="empty-graphic">□</div>
              <h3>暂无二级分类</h3>
              <p>新建后将在这里维护入口文案、系列图和关联产品。</p>
              <button class="btn primary" type="button" data-action="open-series-create">新建二级分类</button>
            </div>
          </div>`;
      }
      if (!series.length) {
        return `
          <div class="empty-state">
            <div>
              <div class="empty-graphic">?</div>
              <h3>未找到匹配的二级分类</h3>
              <p>请按入口文案或系列 ID 调整搜索。</p>
              <button class="btn" type="button" data-action="reset-series-query">清空搜索</button>
            </div>
          </div>`;
      }
      return `
        <div class="table-wrap">
          <table class="data-table series-table">
            <colgroup><col style="width:250px"><col style="width:80px"><col style="width:112px"><col style="width:112px"><col style="width:126px"></colgroup>
            <thead><tr><th>入口文案 / 系列 ID</th><th>关联产品</th><th>创建时间</th><th>更新时间</th><th>操作</th></tr></thead>
            <tbody>
              ${series.map((item, index) => {
                const linked = item.productIds.length;
                return `
                  <tr>
                    <td>
                      <div class="series-cell">
                        <div class="series-thumb">${seriesImageHtml(item, "thumb")}</div>
                        <div class="series-cell-copy">
                          <strong>${esc(seriesDefaultEntry(item) || "未填写入口文案")}</strong>
                          <span class="mono">${esc(shortId(item.id))} · ${linked ? `revision ${item.revision}` : "空系列 · revision " + item.revision}</span>
                        </div>
                      </div>
                    </td>
                    <td>${linked ? `<span class="tag primary">${linked} 个</span>` : `<span class="tag">0 个</span>`}</td>
                    <td class="muted small">${esc(item.createdAt)}</td>
                    <td class="muted small">${esc(item.updatedAt)}</td>
                    <td>
                      <div class="row-actions" ${index === 0 ? 'data-note-target="series-row-actions"' : ''}>
                        <button class="link-btn" type="button" data-action="view-series" data-series-id="${esc(item.id)}">查看</button>
                        <button class="link-btn" type="button" data-action="edit-series" data-series-id="${esc(item.id)}" ${readonly ? "disabled" : ""}>编辑</button>
                        <button class="link-btn danger-link" type="button" data-action="delete-series" data-series-id="${esc(item.id)}" ${readonly ? "disabled" : ""}>删除</button>
                      </div>
                    </td>
                  </tr>`;
              }).join("")}
            </tbody>
          </table>
        </div>
        <div class="pagination">
          <span class="muted small">共 ${series.length} 条</span>
          <div class="pager"><button type="button" disabled aria-label="上一页">‹</button><button class="active" type="button" aria-current="page">1</button><button type="button" disabled aria-label="下一页">›</button></div>
        </div>`;
    }
    function languageSwitchHtml(series, context) {
      const saving = state.saveStatus === "saving";
      return `
        <div class="language-switch" data-note-target="language-switch">
          <label class="visually-hidden" for="localeSelect">配置语言</label>
          <select id="localeSelect" class="select language-select" aria-label="配置语言" data-locale-select="${context}" ${saving ? "disabled" : ""}>
            ${LOCALES.map((locale) => {
              const values = series?.i18n?.[locale.id] || {};
              const filled = ["entry", "title", "content"].filter((field) => String(values[field] || "").trim()).length;
              return `<option value="${esc(locale.id)}" ${state.activeLocale === locale.id ? "selected" : ""}>${esc(locale.label)}${locale.id === DEFAULT_LOCALE ? "（默认）" : ""} · ${filled}/3 已填写</option>`;
            }).join("")}
          </select>
          <span class="language-count">共 ${LOCALES.length} 种语言</span>
        </div>`;
    }

    function renderSeriesView(series, category) {
      const locale = localeInfo(state.activeLocale);
      const fields = ["entry", "title", "content"].map((field) => localeDisplay(series, state.activeLocale, field));
      const fallbackFields = fields
        .map((item, index) => item.fallback && fields[index].value ? ["入口文案", "主要标题", "内容"][index] : "")
        .filter(Boolean);
      const fallbackNotice = fallbackFields.length
        ? `<div class="notice warning" style="margin-bottom:14px"><strong>缺少${esc(locale.label)}翻译：</strong>${esc(fallbackFields.join("、"))}已回退到默认语言（英语）。系列图与关联产品跨语言共享。</div>`
        : `<div class="notice info" style="margin-bottom:14px">当前语言三项文案均已配置。系列图与关联产品跨语言共享。</div>`;
      const products = series.productIds.map(getProduct).filter(Boolean);
      return `
        <div class="detail-hero" data-note-target="view-hero">
          <div class="series-image-large" aria-label="系列图预览">${seriesImageHtml(series, "large")}</div>
          <div style="min-width:0">
            <div class="page-actions" style="justify-content:space-between;align-items:flex-start">
              <div style="min-width:0">
                <h3 class="detail-entry">${esc(fields[0].value || "未填写入口文案")}</h3>
                <p class="detail-subtitle">${esc(fields[1].value || "未填写主要标题")}</p>
              </div>
              <span class="tag success">已保存</span>
            </div>
            <div class="detail-meta">
              <span class="mono">${esc(series.id)}</span>
              <span>·</span>
              <span>${esc(category.name)}</span>
              <span>·</span>
              <span>revision ${series.revision}</span>
              <span>·</span>
              <span>更新于 ${esc(series.updatedAt)}</span>
            </div>
          </div>
        </div>

        ${fallbackNotice}

        <div class="section-title-row">
          <div>
            <h3 class="section-title">语言配置</h3>
            <div class="section-hint">切换语言只改变查看内容；系列图与关联产品保持不变。</div>
          </div>
          ${languageSwitchHtml(series, "view")}
        </div>

        <section class="form-section" data-note-target="view-copy">
          <div class="form-section-head">
            <div>
              <h3 class="form-section-title">平台配置文案</h3>
              <p class="form-section-help">${esc(locale.label)}${state.activeLocale === DEFAULT_LOCALE ? "（默认）" : ""} · 缺项已按默认语言回退</p>
            </div>
            <span class="tag primary">只读</span>
          </div>
          <div class="readonly-grid">
            <div class="readonly-field"><div class="readonly-label">入口文案</div><div class="readonly-value" dir="auto">${esc(fields[0].value)}</div></div>
            <div class="readonly-field"><div class="readonly-label">主要标题</div><div class="readonly-value" dir="auto">${esc(fields[1].value)}</div></div>
          </div>
          <div class="readonly-field" style="margin-top:12px"><div class="readonly-label">内容</div><div class="readonly-value" dir="auto">${esc(fields[2].value)}</div></div>
        </section>

        <section class="form-section association-section" data-note-target="view-products">
          <div class="form-section-head">
            <div>
              <h3 class="form-section-title">关联产品</h3>
              <p class="form-section-help">只可选择同一级分类下的产品；每个产品最多归属一个二级分类。</p>
            </div>
            <span class="tag ${products.length ? "primary" : ""}">${products.length} 个产品</span>
          </div>
          ${products.length ? `
            <div class="table-wrap">
              <table class="data-table association-table">
                <colgroup><col style="width:230px"><col style="width:210px"><col style="width:90px"><col style="width:90px"></colgroup>
                <thead><tr><th>型号 / 产品名称</th><th>产品 ID</th><th>App</th><th>状态</th></tr></thead>
                <tbody>${products.map((product) => `
                  <tr>
                    <td><div class="product-row"><div class="product-icon">设备</div><div><div class="product-model">${esc(product.model)}</div><div class="product-name">${esc(product.name)}</div></div></div></td>
                    <td class="mono muted">${esc(product.id)}</td>
                    <td>${esc(product.app)}</td>
                    <td><span class="tag ${product.status === "已上架" ? "success" : "warning"}">${esc(product.status)}</span></td>
                  </tr>`).join("")}
                </tbody>
              </table>
            </div>` : `<div class="empty-state" style="min-height:150px;padding:28px"><div><div class="empty-graphic">0</div><h3>暂无关联产品</h3><p>编辑时允许清空并保存；有关联时不可删除系列。</p></div></div>`}
        </section>`;
    }

    function renderViewFooter(series) {
      const editDisabled = isReadonly();
      return `
        <span class="footer-note">查看页为只读；编辑操作需具备相应权限。</span>
        <div class="footer-actions">
          <button class="btn" type="button" data-action="go-series-list">返回列表</button>
          <button class="btn primary" type="button" data-action="edit-series" data-series-id="${esc(series.id)}" ${editDisabled ? "disabled" : ""}>编辑</button>
        </div>`;
    }
    function fieldError(key) {
      return state.formErrors?.[key] ? `<div class="field-error">${esc(state.formErrors[key])}</div>` : "";
    }

    function renderSeriesForm(category, editing) {
      const form = state.form;
      if (!form) return "";
      const locale = localeInfo(state.activeLocale);
      const values = form.i18n?.[state.activeLocale] || { entry: "", title: "", content: "" };
      const defaultValues = form.i18n?.[DEFAULT_LOCALE] || { entry: "", title: "", content: "" };
      const readonly = isReadonly();
      const saving = state.saveStatus === "saving";
      const locked = readonly || saving;
      const duplicate = duplicateEntryForForm();
      const currentComplete = ["entry", "title", "content"].filter((field) => String(values[field] || "").trim()).length;
      const otherLocale = state.activeLocale !== DEFAULT_LOCALE;
      return `
        <div class="form-identity" data-note-target="form-identity">
          <div class="identity-item"><div class="identity-label">所属一级分类（只读）</div><div class="identity-value">${esc(category.name)} · ${esc(category.id)}</div></div>
          <div class="identity-item"><div class="identity-label">系列 ID（系统生成，只读）</div><div class="identity-value mono">${esc(form.id || "保存成功时生成")}</div></div>
          <span class="revision-chip">${editing ? `revision ${form.revision}` : "新建 · revision 待生成"}</span>
        </div>

        <div id="duplicateAlertHost">${duplicate ? `<div class="notice warning duplicate-alert" data-note-target="duplicate-alert"><strong>重复入口文案提醒：</strong>同分类已有“${esc(seriesDefaultEntry(duplicate))}”。该提醒不阻断保存；请通过系列 ID 区分记录。</div>` : ""}</div>

        <section class="locale-panel" data-note-target="form-locale">
          <div class="locale-panel-head">
            <div>
              <div class="locale-panel-title">多语言文案</div>
              <div class="field-help" style="margin:0">系列图与关联产品跨语言共享</div>
            </div>
            <span class="locale-status"><span class="status-dot ${currentComplete === 3 ? "complete" : ""}"></span>${esc(locale.label)} ${currentComplete}/3 已填写</span>
          </div>
          <div class="locale-panel-body">
            ${languageSwitchHtml(form, "form")}
            <div class="notice ${otherLocale && currentComplete < 3 ? "warning" : "info"}" style="margin-top:12px">
              ${otherLocale
                ? `当前为${esc(locale.label)}。${currentComplete < 3 ? "缺少的字段将在查看时逐项回退到默认语言（英语）。" : "当前语言字段已完整；缺失翻译时仍按默认语言回退。"}`
                : "英语为默认语言，三项文案均必填；其他15种语言可留空，缺译字段逐项回退英语。"}
            </div>
          </div>
        </section>

        <section class="form-section" data-note-target="form-fields">
          <div class="form-section-head">
            <div>
              <h3 class="form-section-title">${esc(locale.label)}文案字段</h3>
              <p class="form-section-help">入口文案同时用于后台识别；展示文案允许同名，不作为唯一键。${otherLocale ? "其他语言字段可留空。" : "默认语言三项均必填。"}</p>
            </div>
          </div>
          <div class="form-grid">
            <label class="form-label ${state.activeLocale === DEFAULT_LOCALE ? "required" : ""}" for="seriesEntry">入口文案</label>
            <div class="form-control ${state.formErrors?.entry ? "has-error" : ""}">
              <input class="input" id="seriesEntry" data-form-field="entry" value="${esc(values.entry)}" dir="auto" placeholder="${otherLocale ? `留空时回退：${esc(defaultValues.entry || "未配置")}` : "例如：Baby Monitor Series"}" ${locked ? "disabled" : ""}>
              ${fieldError("entry")}
              <div class="field-help">入口文案同时用于后台识别；展示文案允许同名。</div>
            </div>

            <label class="form-label ${state.activeLocale === DEFAULT_LOCALE ? "required" : ""}" for="seriesTitle">主要标题</label>
            <div class="form-control ${state.formErrors?.title ? "has-error" : ""}">
              <input class="input" id="seriesTitle" dir="auto" data-form-field="title" value="${esc(values.title)}" placeholder="${otherLocale ? `留空时回退：${esc(defaultValues.title || "未配置")}` : "请输入主要标题"}" ${locked ? "disabled" : ""}>
              ${fieldError("title")}
            </div>

            <label class="form-label ${state.activeLocale === DEFAULT_LOCALE ? "required" : ""}" for="seriesContent">内容</label>
            <div class="form-control ${state.formErrors?.content ? "has-error" : ""}">
              <textarea class="textarea" id="seriesContent" dir="auto" data-form-field="content" placeholder="${otherLocale ? `留空时回退：${esc(defaultValues.content || "未配置")}` : "请输入内容"}" ${locked ? "disabled" : ""}>${esc(values.content)}</textarea>
              ${fieldError("content")}
              <div class="field-help">缺译时按默认语言回退。</div>
            </div>
          </div>
        </section>

        <section class="form-section" data-note-target="form-image">
          <div class="form-section-head">
            <div>
              <h3 class="form-section-title">系列图 <span style="color:var(--danger)">*</span></h3>
              <p class="form-section-help">请上传用于平台配置的系列图；本地选择后可先预览。</p>
            </div>
          </div>
          <div class="image-field-row">
            <div class="image-upload ${state.formErrors?.image ? "has-error" : ""}" id="imagePreview">
              ${form.image ? `<img src="${esc(form.image)}" alt="系列图上传预览">` : placeholderImageHtml()}
            </div>
            <div>
              <div style="font-weight:500;margin-bottom:4px">${form.image ? esc(state.imageFileName || "本地图片已载入预览") : (form.imagePlaceholder ? "当前为辅助示意占位图" : "尚未选择系列图")}</div>
              <div class="field-help">${form.imagePlaceholder && !form.image ? "当前为示意图。" : "选择本地图片后可预览、替换或移除。"}</div>
              ${fieldError("image")}
              <div class="upload-actions">
                <label class="btn ${locked ? "disabled" : ""}" for="seriesImageInput" aria-disabled="${locked}">上传本地图片</label>
                <input class="visually-hidden" id="seriesImageInput" type="file" accept="image/*" ${locked ? "disabled" : ""}>
                <button class="btn" type="button" data-action="remove-series-image" ${locked || (!form.image && !form.imagePlaceholder) ? "disabled" : ""}>移除图片</button>
              </div>
            </div>
          </div>
        </section>

        <section class="product-picker" data-note-target="form-products">
          ${renderProductPicker(form)}
        </section>

        ${renderSaveFeedback()}

        <div class="form-demo-panel" data-note-target="form-demo">
          <div class="form-demo-head"><span class="demo-kicker">原型演示</span><span>仅在本页面模拟保存异常，不属于真实产品入口。</span></div>
          <div class="form-demo-actions">
            <button class="btn" type="button" data-action="simulate-save-failure">模拟保存失败</button>
            <button class="btn" type="button" data-action="simulate-conflict" ${editing ? "" : "disabled"}>制造 revision 冲突</button>
            <button class="btn" type="button" data-action="fill-duplicate" ${state.activeLocale === DEFAULT_LOCALE ? "" : "disabled"}>填入重复入口文案</button>
            <button class="btn" type="button" data-action="reset-demo">重置全部演示数据</button>
          </div>
          ${state.simulateFailure || state.conflictVersion !== null ? `<div class="field-help" style="color:#8a6508;margin-top:7px">${state.simulateFailure ? "已启用下一次保存失败。" : ""}${state.simulateFailure && state.conflictVersion !== null ? " " : ""}${state.conflictVersion !== null ? `当前表单将按 revision ${state.conflictVersion} 提交，以演示冲突。` : ""}</div>` : ""}
        </div>`;
    }

    function renderProductPicker(form) {
      const readonly = isReadonly() || state.saveStatus === "saving";
      const categoryProducts = db.products.filter((product) => product.categoryId === form.categoryId);
      const selectedCount = form.productIds.length;
      return `
        <div class="product-picker-head">
          <div>
            <div class="form-section-title">关联产品 <span style="color:var(--danger)">${state.route.page === "create" ? "*" : ""}</span></div>
            <div class="field-help">按当前一级分类过滤；同一产品只能被一个系列关联。</div>
          </div>
          <div class="filter-inline">
            <input class="input" id="productSearchInput" value="${esc(state.productQuery)}" placeholder="搜索型号 / 名称 / 产品 ID" aria-label="搜索关联产品">
            <span class="picker-summary">已选 ${selectedCount} 个</span>
          </div>
        </div>
        <div class="product-options">
          ${categoryProducts.map((product) => {
            const owner = productSeries(product.id);
            const selected = form.productIds.includes(product.id);
            const disabledByOwner = Boolean(owner && owner.id !== form.id);
            const disabled = readonly || disabledByOwner;
            return `
              <label class="product-option ${selected ? "selected" : ""} ${disabledByOwner ? "disabled" : ""}" data-product-search="${esc(normalize([product.model, product.name, product.id, product.app].join(" ")))}">
                <input type="checkbox" data-product-id="${esc(product.id)}" ${selected ? "checked" : ""} ${disabled ? "disabled" : ""}>
                <div class="product-option-main">
                  <div class="product-option-title"><strong>${esc(product.model)}</strong><span>${esc(product.name)}</span><span class="tag ${product.status === "已上架" ? "success" : "warning"}">${esc(product.status)}</span></div>
                  <div class="product-option-meta"><span class="mono">${esc(product.id)}</span><span>${esc(product.app)}</span></div>
                </div>
                ${owner ? (owner.id === form.id ? `<span class="tag primary">当前系列</span>` : `<span class="occupied-reason">已被「${esc(seriesDefaultEntry(owner))}」关联</span>`) : `<span class="tag">可关联</span>`}
              </label>`;
          }).join("")}
          <div class="picker-empty" id="pickerFilterEmpty" style="display:none">没有符合条件的同分类产品</div>
        </div>
        ${state.formErrors?.products ? `<div class="field-error" style="padding:8px 12px;border-top:1px solid var(--border-lighter)">${esc(state.formErrors.products)}</div>` : ""}
        <div style="padding:8px 12px;border-top:1px solid var(--border-lighter);color:var(--text-secondary);font-size:11px;line-height:17px">
          仅展示同分类产品；已被其他系列占用的产品不可选择。
        </div>`;
    }

    function renderSaveFeedback() {
      if (!state.saveError) return "";
      const conflict = state.saveError.type === "conflict";
      const buttons = conflict
        ? `<button class="btn primary" type="button" data-action="refresh-conflict">刷新最新数据</button><button class="btn" type="button" data-action="dismiss-save-error">返回修改</button>`

    function renderModal() {

              ${modal.errorField === "code" ? `<div class="field-error">请输入产品分类编码</div>` : ""}

        const category = getCategory(modal.categoryId);
        const series = seriesForCategory(modal.categoryId);
        return wrap(
          "无法删除产品分类",
          `<p class="modal-message"><span class="modal-block-icon">!</span>“${esc(category?.name || "")}”下仍有 ${series.length} 个二级分类。请先处理该分类下的二级分类，再删除一级分类。</p>

          `<button class="btn" type="button" data-action="close-modal">知道了</button><button class="btn primary" type="button" data-action="open-series-from-block" data-category-id="${esc(modal.categoryId)}">查看二级分类</button>`

      if (modal.type === "categoryDelete") {

        return wrap(

          `<p class="modal-message">确定删除“${esc(category?.name || "")}”吗？该分类当前没有二级分类。删除后不可恢复。</p>`,
          `<button class="btn" type="button" data-action="close-modal">取消</button><button class="btn danger" type="button" data-action="confirm-delete-category" data-category-id="${esc(modal.categoryId)}">删除</button>`
        );
      }
      if (modal.type === "seriesBlocked") {
        const series = getSeries(modal.seriesId);
        return wrap(
          "无法删除二级分类",
          `<p class="modal-message"><span class="modal-block-icon">!</span>“${esc(series ? seriesDefaultEntry(series) : "")}”仍关联 ${series?.productIds.length || 0} 个产品。删除前请先编辑并解除全部产品关联。</p>

        );
      }
      if (modal.type === "seriesDelete") {
        const series = getSeries(modal.seriesId);
        const failure = modal.error ? `<div class="notice danger" style="margin-top:12px"><strong>删除失败：</strong>${esc(modal.error)} 系列仍保留，可再次确认重试。</div>` : "";
        const demo = `<div class="form-demo-panel" style="margin-top:12px"><div class="form-demo-head"><span class="demo-kicker">原型演示</span><span>用于验证删除失败后的保留与重试。</span></div><div class="form-demo-actions"><button class="btn" type="button" data-action="simulate-delete-failure">${state.simulateDeleteFailure ? "已启用：下次删除失败" : "模拟删除失败"}</button></div></div>`;
        return wrap(
          "删除二级分类",
          `<p class="modal-message">确定删除“${esc(series ? seriesDefaultEntry(series) : "")}”吗？该系列当前无关联产品。删除后配置不可恢复。</p>${failure}${demo}`,

      if (modal.type === "unsaved") {
        return wrap(
          "有未保存的修改",
          `<p class="modal-message">当前配置尚未保存。离开后，本次修改将丢失。</p>`,

        );

      if (modal.type === "refreshConflict") {
        return wrap(
          "刷新最新数据",
          `<p class="modal-message">刷新会加载服务端最新 revision，并覆盖当前未保存的修改。原型中仅模拟这一行为。</p>`,
          `<button class="btn" type="button" data-action="close-modal">取消</button><button class="btn primary" type="button" data-action="confirm-refresh-conflict">刷新并重新编辑</button>`
        );
      }
      return "";
    }
