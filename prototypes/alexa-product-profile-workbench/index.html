<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alexa Product Profile | Momcozy IoT Admin</title>
    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/app.css" />
  </head>
  <body>
    <div class="prototype-shell" data-mobile-view="product">
      <div class="mobile-view-switcher" role="tablist" aria-label="原型视图切换">
        <button class="mobile-view-tab is-active" data-mobile-view-target="product" role="tab" aria-selected="true">产品界面</button>
        <button class="mobile-view-tab" data-mobile-view-target="notes" role="tab" aria-selected="false">原型批注</button>
      </div>

      <main class="product-pane" id="productPane" aria-label="Momcozy IoT Admin 产品界面">
        <div class="admin-app" id="adminApp">
          <aside class="side-nav">
            <div class="brand-lockup">
              <div class="brand-mark">M</div>
              <div>
                <div class="brand-name">momcozy</div>
                <div class="brand-subtitle">AIoT Platform</div>
              </div>
            </div>
            <div class="tenant-switcher">
              <span class="tenant-dot"></span>
              <span class="tenant-name">Momcozy Global</span>
              <span class="tenant-caret">v</span>
            </div>
            <nav class="primary-nav" aria-label="主导航">
              <button class="nav-item" data-action="nav" data-page="dashboard"><span class="nav-glyph">[]</span><span>工作台</span></button>
              <button class="nav-item" data-action="nav" data-page="products"><span class="nav-glyph">#</span><span>智能产品</span></button>
              <div class="nav-section-label">配置中心</div>
              <button class="nav-item is-active" data-action="nav" data-page="profiles"><span class="nav-glyph">*</span><span>Alexa Profile</span></button>
              <button class="nav-item" data-action="nav" data-page="catalog"><span class="nav-glyph">=</span><span>能力目录</span></button>
              <button class="nav-item" data-action="nav" data-page="handlers"><span class="nav-glyph">&lt;&gt;</span><span>Handler 注册</span></button>
              <div class="nav-section-label">测试与运维</div>
              <button class="nav-item" data-action="nav" data-page="connect"><span class="nav-glyph">~</span><span>连接与发现测试</span></button>
              <button class="nav-item" data-action="nav" data-page="logs"><span class="nav-glyph">:</span><span>调用日志</span></button>
            </nav>
            <div class="side-nav-footer">
              <div class="status-line"><span class="status-dot status-dot--success"></span><span>Adapter 在线</span><span class="version-text">v2.4.0</span></div>
              <button class="nav-item nav-item--footer"><span class="nav-glyph">?</span><span>帮助与文档</span></button>
            </div>
          </aside>

          <section class="workspace">
            <header class="topbar">
              <div class="breadcrumb" id="breadcrumb"><span>配置中心</span><span class="breadcrumb-slash">/</span><strong>Alexa Product Profile</strong></div>
              <div class="topbar-actions">
                <span class="environment-chip"><span class="environment-dot"></span>Sandbox</span>
                <button class="icon-button" title="通知" aria-label="通知"><span class="bell-icon">!</span><span class="notification-badge">3</span></button>
                <div class="user-menu"><span class="avatar">LY</span><span>林宇</span><span class="caret">v</span></div>
              </div>
            </header>
            <div class="page-area">
              <div class="page-header" id="pageHeader"></div>
              <div id="pageRoot"></div>
            </div>
          </section>
        </div>
        <div id="drawerMount"></div>
      </main>

      <aside class="annotation-panel" id="annotationPanel" aria-label="原型批注">
        <div class="annotation-header">
          <div>
            <div class="annotation-kicker">ANNOTATED PROTOTYPE</div>
            <h2>原型批注</h2>
          </div>
          <span class="annotation-count" id="annotationCount">0</span>
        </div>
        <div class="annotation-context" id="annotationContext">Profiles / Alexa Product Profile</div>
        <div class="annotation-summary" id="annotationSummary"></div>
        <div class="annotation-list" id="annotationList"></div>
        <div class="annotation-footer">
          <span class="footer-key">交互范围</span>
          <span>配置 / 校验 / 发布 / 授权 / Discovery</span>
        </div>
      </aside>
    </div>

    <div id="modalMount"></div>
    <div class="toast-region" id="toastRegion" aria-live="polite"></div>

    <script type="module" src="app/index.js?v=20260806h"></script>
  </body>
</html>
