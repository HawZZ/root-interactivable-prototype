<body>
<div class="app-shell mobile-product" id="appShell">
<main class="product-viewport"><div class="product-canvas">
<aside class="sidebar"><div class="brand"><span class="brand-mark">IoT</span> IoT Admin</div><div class="menu-group"><div class="menu-title">配置中心</div><div class="menu-item"><span class="menu-icon">◈</span>物模型池</div><div class="menu-item"><span class="menu-icon">▣</span>产品模板</div><div class="menu-item"><span class="menu-icon">◇</span>多语言</div><div class="menu-item"><span class="menu-icon">⚙</span>系统配置</div><div class="menu-item active"><span class="menu-icon">▤</span>资源配置<span class="anchor">1</span></div></div><div class="menu-group"><div class="menu-title">智能产品</div><div class="menu-item"><span class="menu-icon">⌂</span>产品列表</div><div class="menu-item"><span class="menu-icon">◫</span>消息推送</div></div><div class="menu-group"><div class="menu-title">设备管理</div><div class="menu-item"><span class="menu-icon">◉</span>设备列表</div><div class="menu-item"><span class="menu-icon">↗</span>OTA</div></div></aside>
<section class="main-area"><header class="topbar"><div class="crumb">配置中心 / <b>资源配置</b></div><div class="top-right"><span class="scenario-label">演示状态</span><select class="scenario" id="scenario"><option value="normal">正常</option><option value="upload-fail">上传失败</option><option value="import-fail">导入失败</option></select><span style="color:#8a96a8">●</span><span style="font-size:12px;color:#526174">测试环境</span></div></header><div class="mobile-switch"><button class="active" data-mobile="product">产品</button><button data-mobile="notes">批注</button></div><div class="content" id="content"></div></section>
</div></main><aside class="notes" id="notes"></aside></div><div id="layer"></div><div class="toast" id="toast"></div>
<script>
const products=['吸奶器V4','BM04','Lumi1','母乳分析仪'];
const locales=['中文（简体）','English','Deutsch','Français','繁體中文','日本語','العربية'];
const keyRows=[{key:'sleepGuide',filled:18,total:64,media:3,status:'ACTIVE',last:'2026-11-18 10:24'},{key:'deviceEmptyState',filled:48,total:64,media:2,status:'ACTIVE',last:'2026-11-18 09:41'},{key:'lumi1JointMobility',filled:2,total:16,media:2,status:'ACTIVE',last:'2026-11-17 18:02'},{key:'appBannerHome',filled:16,total:64,media:4,status:'DISABLED',last:'暂无'}];
const slotFiles={'BM04|中文（简体）':'sleep-guide-zh.webp','BM04|English':'sleep-guide-en.webp','Lumi1|中文（简体）':'sleep-guide-zh.webp','吸奶器V4|English':'sleep-guide-en.webp','母乳分析仪|Deutsch':'sleep-guide-de.webp','Lumi1|English':'lumi1-guide.mp4'};
const mediaTypes={'sleep-guide-zh.webp':'image','sleep-guide-en.webp':'image','sleep-guide-de.webp':'image','lumi1-guide.mp4':'video','product-tour.gif':'gif'};
let state={drawer:null,detailKey:'sleepGuide',sourceSlot:null,syncMode:'horizontal',overwrite:false,scenario:'normal',importStage:'upload',importRows:[],selected:'a1',mediaSelected:false,selectorMode:null,selectorRef:null,targetProducts:['BM04','Lumi1'],targetLocales:['中文（简体）'],importSelection:{products:['BM04'],locales:['中文（简体）']},importOverwrite:false,previewFile:null,previewSlot:null,confirmSlot:null,createKeyReturn:null,createKeyForIndex:null,createKeyDraft:''};
function anchor(n){return `<span class="anchor">${n}</span>`}
function tag(s){return `<span class="tag ${s==='ACTIVE'?'success':s==='DISABLED'?'warning':'info'}">${s}</span>`}
function mediaType(file){return mediaTypes[file]||(file?.endsWith('.mp4')?'video':file?.endsWith('.gif')?'gif':'image')}
function mediaThumb(file,cls=''){const t=mediaType(file);return `<span class="mini-thumb ${t} ${cls}">${t==='video'?'▶':t==='gif'?'GIF':'IMG'}</span>`}
const localeCodes={'中文（简体）':'zh-CN','English':'en-US','Deutsch':'de-DE','Français':'fr-FR','繁體中文':'zh-TW','日本語':'ja-JP','العربية':'ar'};
function localeCode(locale){return localeCodes[locale]||locale}
function mediaUrl(key,slot,file){const [p,l]=slot.split('|');return `https://cdn-demo.luteos.com/iot-resource/${encodeURIComponent(key)}/${encodeURIComponent(p)}/${localeCode(l)}/${encodeURIComponent(file)}`}
function urlLine(key,slot,file){const url=mediaUrl(key,slot,file);return `<div class="url-line"><span title="${url}">${url}</span><button class="btn small" data-action="copy-url" data-copy-value="${url}">复制</button></div>`}
function mediaPreview(file,slot='',key=state.detailKey){const t=mediaType(file);return `<div class="media-preview ${t} click-preview" data-action="preview-media" data-file="${file}" data-slot="${slot}">${t==='video'?'<span class="play">▶</span>':''}<span class="media-code">${t==='video'?'VIDEO':t==='gif'?'ANIMATED':'IMAGE'} · ${file}</span></div>`}
function combinationValues(values,all){return values.includes('通用')?all:values}
function targetCombos(productsSelected=state.targetProducts,localesSelected=state.targetLocales){const ps=combinationValues(productsSelected,products),ls=combinationValues(localesSelected,locales);return ps.flatMap(p=>ls.map(l=>`${p}|${l}`))}
function choiceButtons(dimension,values,all){return ['通用',...all].map(x=>`<button class="choice ${values.includes(x)?'active':''}" data-action="toggle-choice" data-dimension="${dimension}" data-value="${x}">${values.includes(x)?'✓ ':''}${x}</button>`).join('')}
function choicePanel(kind='binding'){const isImport=kind==='import';const ps=isImport?state.importSelection.products:state.targetProducts;const ls=isImport?state.importSelection.locales:state.targetLocales;return `<div class="choice-panel"><div class="choice-group"><h4>产品维度</h4><div class="choice-items">${choiceButtons('products',ps,products)}</div></div><div class="choice-group"><h4>语言维度</h4><div class="choice-items">${choiceButtons('locales',ls,locales)}</div></div></div><div class="combination-box"><div class="combination-head"><span>已选组合 C(产品，语言)</span><span>${targetCombos(ps,ls).length} 个</span></div>${targetCombos(ps,ls).length?targetCombos(ps,ls).map(x=>{const [p,l]=x.split('|');return `<span class="chip">${p} × ${l}<button class="x" data-action="remove-combo" data-combo="${x}" data-kind="${kind}">×</button></span>`}).join(''):'<div class="combination-empty">请选择至少一个产品和一个语言；选择“通用”会展开到当前全部主数据。</div>'}</div>`}
function listView(){return `<div class="page-title"><div><h1>资源配置 ${anchor(2)}</h1><div class="subtitle">以 Key 管理产品×Locale 槽位和可复用媒体资源</div></div><div class="title-actions"><button class="btn" data-action="import">批量导入 ${anchor(7)}</button><button class="btn primary" data-action="create-key">新建资源 ID ${anchor(3)}</button></div></div><div class="filter-bar" data-anchor="a3"><div class="field"><label>Key</label><input placeholder="请输入 Key"/></div><div class="field"><label>关联产品</label><select><option>全部产品</option>${products.map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>关联语言</label><select><option>全部语言</option>${locales.map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>状态</label><select><option>全部状态</option><option>ACTIVE</option><option>DISABLED</option><option>ARCHIVED</option></select></div><div class="filter-actions"><button class="btn primary" data-action="query">查询</button><button class="btn" data-action="reset">重置</button></div></div><div class="summary-strip"><div class="metric"><div class="k">Key 总数</div><div class="v">42</div></div><div class="metric"><div class="k">已配置槽位</div><div class="v">1,268</div></div><div class="metric"><div class="k">近 24 小时调用</div><div class="v">86</div></div></div><div class="table-card"><div class="table-head"><strong>Key 列表 ${anchor(4)}</strong><span class="table-hint">共 42 个 Key · 10 条/页</span></div><table><thead><tr><th style="width:220px">Key</th><th style="width:135px">槽位配置</th><th style="width:105px">媒体资源数</th><th style="width:115px">Key 状态</th><th style="width:160px">最近平台调用</th><th>解析入口</th><th style="width:170px">操作 ${anchor(5)}</th></tr></thead><tbody>${keyRows.map(r=>`<tr><td><div class="key">${r.key}</div><div class="key-sub">大小写精确匹配 · Key 主体</div></td><td>${r.filled}/${r.total}</td><td>${r.media}</td><td>${tag(r.status)}</td><td>${r.last}</td><td><div class="url">/api/resource/resolve?key=${r.key}&productId={product}&locale={locale}</div></td><td><button class="btn link" data-action="key-preview" data-key="${r.key}">预览</button><button class="btn link" data-action="detail" data-key="${r.key}">查看矩阵</button></td></tr>`).join('')}</tbody></table><div class="pagination"><span>共 42 个 Key</span><span>‹</span><span class="page-no">1</span><span>2</span><span>3</span><span>›</span><select style="height:28px;border:1px solid var(--line-strong);border-radius:6px;color:var(--sub)"><option>10条/页</option></select></div></div>`}
function slotCard(p,l,key){const slot=`${p}|${l}`,f=slotFiles[slot];if(!f)return `<button class="slot-card empty" data-action="slot" data-slot="${slot}"><span class="slot-add"><strong>＋</strong><br/>上传媒体</span></button>`;return `<div class="slot-card filled"><div class="slot-card-main" data-action="preview-media" data-file="${f}" data-slot="${slot}">${mediaThumb(f)}<span class="slot-file"><strong>${f}</strong><span>已发布 · 访问权限待技术校验</span></span></div><div class="slot-actions"><button class="btn small" data-action="preview-media" data-file="${f}" data-slot="${slot}">预览</button><button class="btn small" data-action="sync" data-slot="${slot}">同步</button><button class="btn small danger" data-action="remove-binding" data-slot="${slot}">移除</button></div>${urlLine(key,slot,f)}</div>`}
function matrix(key){return `<div class="matrix-wrap" data-anchor="a5"><table class="matrix"><thead><tr><th style="width:125px">产品 \\ Locale</th>${locales.slice(0,5).map(l=>`<th>${l}</th>`).join('')}</tr></thead><tbody>${products.map(p=>`<tr><th>${p}</th>${locales.slice(0,5).map(l=>`<td>${slotCard(p,l,key)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function keyPreviewDrawer(){const key=state.detailKey;const cells=products.flatMap(p=>locales.slice(0,5).map(l=>({p,l,f:slotFiles[`${p}|${l}`]})));return `<div class="overlay" data-action="close"></div><aside class="drawer wide"><div class="drawer-head"><h3>Key 预览 · ${key} ${anchor(8)}</h3><button class="close" data-action="close">×</button></div><div class="drawer-body"><div class="annotation-only">预览用于核对一个 Key 在不同产品×Locale 下实际绑定的媒体；点击缩略图可放大查看，空槽位显示未配置。</div><div class="preview-grid">${cells.map(x=>`<div class="detail-card"><div class="preview-slot">${x.p} × ${x.l}</div>${x.f?mediaPreview(x.f,`${x.p}|${x.l}`):`<div class="media-preview" style="background:#f4f6f9;color:#9aa5b5;box-shadow:none"><span class="media-code">未配置</span></div>`}<div class="preview-meta">${x.f||'当前槽位没有媒体'}</div>${x.f?urlLine(key,`${x.p}|${x.l}`,x.f):''}</div>`).join('')}</div></div><div class="drawer-footer"><button class="btn" data-action="close">关闭</button><button class="btn primary" data-action="detail" data-key="${key}">进入矩阵</button></div></aside>`}
function createKeyDrawer(){const fromImport=state.createKeyReturn==='import';return `<div class="overlay" data-action="close"></div><aside class="drawer"><div class="drawer-head"><h3>${fromImport?'新建资源 ID':'新建资源 ID'} ${anchor(3)}</h3><button class="close" data-action="close">×</button></div><div class="drawer-body"><div class="annotation-only">资源 ID 是媒体资源被 API 请求时使用的唯一标识，原名为 Key。创建后不可修改，也不可再次分配给其他资源。</div><div class="form-row"><label class="required">资源 ID</label><div><input class="field-input" style="width:100%;height:36px;border:1px solid var(--line-strong);border-radius:7px;padding:0 10px" data-create-key-input value="${state.createKeyDraft||''}" placeholder="例如 sleepGuide"/><div class="helper">首字符必须为字母；支持大小写字母、数字、-、_、.；驼峰格式仅为建议。</div></div></div><div class="detail-card soft"><div class="label">创建后</div><div class="value">资源 ID 只读；可继续在资源矩阵配置产品和语言应用范围。</div></div></div><div class="drawer-footer"><button class="btn" data-action="close">取消</button><button class="btn primary" data-action="submit-create-key">${fromImport?'创建并返回应用范围':'创建并进入资源矩阵'}</button></div></aside>`}
function detailDrawer(){const key=state.detailKey;return `<div class="overlay" data-action="close"></div><aside class="drawer wide"><div class="drawer-head"><h3>资源详情 · ${key} ${anchor(8)}</h3><button class="close" data-action="close">×</button></div><div class="drawer-body"><div class="detail-head"><div><div class="key big-key">${key}</div></div><div style="display:flex;gap:8px"><button class="btn" data-action="key-preview" data-key="${key}">预览 Key</button><button class="btn primary" data-action="upload-media">上传媒体 ${anchor(9)}</button></div></div><div class="detail-grid"><div class="detail-card"><div class="label">已配置范围</div><div class="value">18 / 64</div></div><div class="detail-card"><div class="label">媒体资源数</div><div class="value">3 个（按文件去重）</div></div><div class="detail-card"><div class="label">资源最近调用</div><div class="value">2026-11-18 10:24</div></div><div class="detail-card"><div class="label">资源状态</div><div class="value">${tag('ACTIVE')}</div><div class="helper">状态不可由用户变更，由后台评估后处理</div></div></div><div class="matrix-title">资源矩阵 ${anchor(10)}</div>${matrix(key)}</div><div class="drawer-footer"><button class="btn" data-action="close">关闭</button></div></aside>`}
function uploadMediaDrawer(){return `<div class="overlay" data-action="close"></div><aside class="drawer"><div class="drawer-head"><h3>上传媒体并绑定槽位 ${anchor(11)}</h3><button class="close" data-action="close">×</button></div><div class="drawer-body"><div class="annotation-only">上传一次媒体后，独立选择产品维度和语言维度，系统按 C(产品，语言) 展开目标槽位。选择“通用”会覆盖该维度下当前全部主数据。</div><div class="form-row"><label class="required">媒体文件</label><div class="upload-box"><div class="upload-head"><span>图片、动图或视频</span><button class="btn" data-action="select-media">选择文件</button></div><div class="helper">媒体资源通过校验后才能创建 SlotAssignment。</div>${state.mediaSelected?`<div class="file-chip"><span class="table-preview">${mediaThumb('sleep-guide-zh.webp')} sleep-guide-zh.webp · 1.8 MB</span><button class="btn link" data-action="preview-media" data-file="sleep-guide-zh.webp">预览</button></div>`:''}</div></div><div class="form-row"><label class="required">目标产品×语言</label><div>${choicePanel('binding')}</div></div><div class="form-row"><label>覆盖策略</label><div><label style="display:block;margin:7px 0"><input type="radio" name="bind-policy" checked/> 仅填充空槽位</label><label style="display:block;margin:7px 0"><input type="radio" name="bind-policy"/> 覆盖已有（提交前再次确认）</label></div></div></div><div class="drawer-footer"><button class="btn" data-action="close">取消</button><button class="btn primary" data-action="bind-media" ${state.mediaSelected&&targetCombos().length?'':'disabled'}>上传并绑定</button></div></aside>`}
function syncDrawer(){const src=state.sourceSlot||'BM04|中文（简体）';const [sp,sl]=src.split('|');const f=slotFiles[src];const mode=state.syncMode;const targets=mode==='horizontal'?locales.filter(x=>x!==sl).slice(0,4).map(l=>`${sp}|${l}`):mode==='vertical'?products.filter(x=>x!==sp).slice(0,3).map(p=>`${p}|${sl}`):products.flatMap(p=>locales.slice(0,4).map(l=>`${p}|${l}`)).filter(x=>x!==src).slice(0,8);const conflicts=targets.filter(x=>slotFiles[x]).length;const empty=targets.length-conflicts;return `<div class="overlay" data-action="close"></div><aside class="drawer sync-drawer"><div class="drawer-head"><div><div class="drawer-eyebrow">资源详情 / 应用范围</div><h3>同步到其他应用范围 ${anchor(12)}</h3></div><button class="close" data-action="close">×</button></div><div class="drawer-body"><div class="sync-source"><div class="sync-source-media">${mediaPreview(f,src)}</div><div class="sync-source-copy"><div class="section-kicker">源槽位</div><div class="sync-source-name">${sp} × ${sl}</div><div class="sync-source-meta">${f} · 已发布</div><button class="btn small" data-action="preview-media" data-file="${f}" data-slot="${src}">预览媒体</button></div></div><div class="sync-step"><div class="sync-step-head"><span class="sync-step-number">1</span><div><strong>选择同步方向</strong><span>从当前源槽位生成目标范围</span></div></div><div class="sync-modes" data-anchor="a6"><button class="sync-mode-card ${mode==='horizontal'?'active':''}" data-action="sync-mode" data-mode="horizontal"><b>横向同步</b><small>同产品 · 其他语言</small></button><button class="sync-mode-card ${mode==='vertical'?'active':''}" data-action="sync-mode" data-mode="vertical"><b>纵向同步</b><small>同语言 · 其他产品</small></button><button class="sync-mode-card ${mode==='full'?'active':''}" data-action="sync-mode" data-mode="full"><b>全面同步</b><small>当前资源 ID · 其他范围</small></button></div></div><div class="sync-step"><div class="sync-step-head"><span class="sync-step-number">2</span><div><strong>检查应用范围</strong><span>目标先生成快照，提交前仍可切换方向</span></div><em>${targets.length} 个目标</em></div><div class="sync-summary"><span><b>${empty}</b> 个空槽位</span><span><b>${conflicts}</b> 个已有媒体资源</span><span>复用 1 个媒体资源</span></div><div class="sync-target-grid">${targets.map(x=>{const [p,l]=x.split('|');const existing=slotFiles[x];return `<div class="sync-target-card ${existing?'has-media':''}"><div class="sync-target-head"><strong>${p}</strong><span>× ${l}</span></div><div class="sync-target-preview">${existing?mediaPreview(existing,x):`<div class="sync-empty"><span>＋</span><small>空槽位</small></div>`}</div><div class="sync-target-foot"><span class="sync-target-status ${existing?'occupied':''}">${existing?'已有媒体资源':'仅填充空槽位'}</span>${existing?`<button class="btn link small" data-action="preview-media" data-file="${existing}" data-slot="${x}">预览</button>`:''}</div></div>`}).join('')}</div></div><div class="sync-step"><div class="sync-step-head"><span class="sync-step-number">3</span><div><strong>选择冲突策略</strong><span>覆盖已有媒体资源需要再次确认</span></div></div><div class="sync-policy-grid"><label class="sync-policy-option ${!state.overwrite?'selected':''}"><input type="radio" name="sync-policy" ${!state.overwrite?'checked':''} data-action="policy"/><span><b>仅填充空槽位</b><small>已有媒体资源的目标保持不变</small></span></label><label class="sync-policy-option ${state.overwrite?'selected':''}"><input type="radio" name="sync-policy" ${state.overwrite?'checked':''} data-action="policy"/><span><b>覆盖已有</b><small>将当前媒体资源覆盖到 ${conflicts} 个已有目标</small></span></label></div></div><div class="sync-guard">提交后目标槽位一次性更新；任一目标校验失败时，不切换任何目标当前指针。</div></div><div class="drawer-footer"><button class="btn" data-action="close">取消</button><button class="btn primary" data-action="apply-sync">${state.overwrite?'确认覆盖并同步':'同步空槽位'} ${anchor(14)}</button></div></aside>`}
function importDrawer(){if(state.importRows.length===0)state.importRows=[{ref:'media-001',file:'sleep-guide-zh.webp',key:'sleepGuide',progress:state.scenario==='upload-fail'?62:100,status:state.scenario==='upload-fail'?'fail':'done',targets:['BM04|中文（简体）','Lumi1|中文（简体）']},{ref:'media-002',file:'lumi1-guide.mp4',key:'lumi1JointMobility',progress:100,status:'done',targets:['Lumi1|English']}];const ready=state.importRows.length>0&&state.importRows.every(x=>x.status==='done');const valid=state.importRows.length>0&&state.importRows.every(x=>x.key&&x.targets.length);const validationHint=!ready?'请先完成失败媒体重试':!valid?'请为每个媒体选择资源 ID，并设置应用范围':'';return `<div class="overlay" data-action="close"></div><aside class="drawer wide"><div class="drawer-head"><h3>批量导入媒体资源 ${anchor(15)}</h3><button class="close" data-action="close">×</button></div><div class="drawer-body"><div class="steps"><div class="step ${state.importStage==='upload'?'active':'done'}"><i>1</i>上传媒体</div><span class="step-line"></span><div class="step ${['map','select'].includes(state.importStage)?'active':state.importStage==='done'?'done':''}"><i>2</i>配置资源 ID/应用范围</div><span class="step-line"></span><div class="step ${state.importStage==='done'?'active':''}"><i>3</i>完成</div></div>${state.importStage==='upload'?importUploadStage(ready):state.importStage==='map'?importMapStage():state.importStage==='select'?importSelectorStage():state.importStage==='fail'?importFailStage():`<div style="text-align:center;padding:60px 0"><div style="font-size:42px;color:var(--success)">✓</div><h3 style="font-weight:650">导入任务已提交</h3><p style="color:var(--muted)">媒体资源已按资源 ID 和应用范围建立导入任务。</p></div>`}</div><div class="drawer-footer">${state.importStage==='upload'?`<button class="btn" data-action="close">取消</button><button class="btn primary" ${ready?'':'disabled'} data-action="map-import">配置资源 ID/应用范围</button>`:state.importStage==='map'?`<span class="footer-hint">${validationHint}</span><button class="btn" data-action="import-back-upload">上一步</button><button class="btn" data-action="close">后台运行</button><button class="btn primary" data-action="run-import" ${valid?'':'disabled'}>确认导入</button>`:state.importStage==='select'?`<button class="btn" data-action="cancel-selector">返回映射</button><button class="btn primary" data-action="apply-import-selector" ${targetCombos(state.importSelection.products,state.importSelection.locales).length?'':'disabled'}>保存应用范围</button>`:state.importStage==='fail'?`<button class="btn" data-action="close">关闭</button><button class="btn primary" data-action="retry-import">返回映射重试</button>`:`<button class="btn" data-action="close">关闭</button><button class="btn primary" data-action="close">查看资源配置</button>`}</div></aside>`}
function importUploadStage(ready){return `<div class="annotation-only">上传主体是媒体资源。每个媒体独立展示进度，失败只影响对应媒体；全部上传成功后进入 Key/槽位配置。</div><div class="upload-list">${state.importRows.map((x,i)=>`<div class="upload-row"><div class="upload-row-top">${mediaThumb(x.file)}<span class="upload-name">${x.ref} · ${x.file}</span><span class="upload-size">${x.key}</span><div class="row-actions">${x.status==='fail'?`<button class="btn link" data-action="retry-media" data-index="${i}">重试</button>`:`<span class="row-status ${x.status==='done'?'done':'wait'}">${x.status==='done'?'上传完成':x.progress+'%'}</span>`}<button class="btn link danger" data-action="remove-import" data-index="${i}">移除</button></div></div><div class="progress"><div class="progress-bar ${x.status==='fail'?'fail':x.status==='done'?'done':''}" style="width:${x.progress}%"></div></div>${x.status==='fail'?`<div class="row-status fail" style="margin-top:7px">上传失败：文件校验未通过，其他媒体继续。</div>`:''}</div>`).join('')}</div><button class="btn" style="margin-top:12px" data-action="add-import-media">＋ 添加媒体</button><div class="import-summary"><span>已准备 ${state.importRows.filter(x=>x.status==='done').length}/${state.importRows.length} 个媒体</span><span>${ready?'可配置 Key/槽位':'请先完成失败媒体重试'}</span></div>`}
function mappingTargetChips(targets){return targets.length?targets.map(x=>{const [p,l]=x.split('|');const exists=!!slotFiles[x];return `<span class="chip ${exists?'conflict':''}">${p} × ${l}${exists?' · 已有':''}</span>`}).join(''):'<span class="combination-empty">未选择槽位</span>'}
function importMapStage(){const valid=state.importRows.length>0&&state.importRows.every(x=>x.key&&x.targets.length);return `<div class="annotation-only">每个媒体资源必须关联一个资源 ID（原名 Key）供 API 调用。可搜索/选择已有资源 ID，也可新建资源 ID；“应用范围”用于设置该媒体关联哪些产品和语言。</div><div class="upload-list" data-anchor="a7"><datalist id="resource-id-list">${keyRows.map(k=>`<option value="${k.key}"></option>`).join('')}</datalist>${state.importRows.map((x,i)=>`<div class="upload-row"><div class="mapping-row"><div><div class="mapping-meta">${mediaThumb(x.file)}<span class="upload-name">${x.ref} · ${x.file}</span><div class="mapping-key-input"><input list="resource-id-list" data-import-key="${i}" value="${x.key||''}" placeholder="搜索或输入资源 ID"/><button class="btn small" data-action="create-key-from-import" data-index="${i}">新建资源 ID</button></div></div><div class="mapping-targets">${mappingTargetChips(x.targets)}</div></div><div class="row-actions"><button class="btn small" data-action="edit-import-slots" data-index="${i}">应用范围</button><button class="btn small danger" data-action="remove-import" data-index="${i}">移除媒体</button></div></div></div>`).join('')}</div><div class="policy-panel"><h4>导入策略</h4><label class="policy-option"><input type="radio" name="import-policy" ${!state.importOverwrite?'checked':''} data-action="import-policy"/><span><b>仅填充</b><br/>如果资源 ID 的对应产品+语言已有媒体资源，则跳过导入，保留现有媒体。</span></label><label class="policy-option"><input type="radio" name="import-policy" ${state.importOverwrite?'checked':''} data-action="import-policy"/><span><b>覆盖已有</b><br/>将当前准备导入的媒体资源覆盖相关资源 ID 的应用范围。</span></label></div><div class="import-summary"><span>当前映射 ${state.importRows.length} 个媒体</span><span>${valid?'可以确认导入':'待完善资源 ID 和应用范围'}</span></div>`}
function importSelectorStage(){const row=state.importRows[state.selectorRef]||{ref:'media',file:'媒体'};return `<div class="annotation-only">正在设置 <b>${row.ref} · ${row.file}</b> 的应用范围。产品和语言独立选择，保存后只影响这一条媒体映射。</div><div class="selector-title">应用范围：产品×Locale</div>${choicePanel('import')}`}

function mediaPreviewModal(){const f=state.previewFile;if(!f)return '';const slot=state.previewSlot||'';return `<div class="overlay" data-action="close"></div><div class="preview-modal"><div class="preview-modal-head"><strong>媒体预览</strong><button class="close" data-action="close">×</button></div><div class="preview-modal-body">${mediaPreview(f,slot)}<div class="preview-meta-grid"><div class="detail-card"><div class="label">文件</div><div class="value">${f}</div></div><div class="detail-card"><div class="label">槽位</div><div class="value">${slot?slot.replace('|',' × '):'未绑定'}</div></div></div>${slot?urlLine(state.detailKey,slot,f):'<div class="helper">该媒体尚未绑定槽位，访问权限由 API 请求链路校验。</div>'}</div><div class="preview-modal-foot"><button class="btn" data-action="close">关闭</button>${slot?`<button class="btn primary" data-action="sync-from-preview" data-slot="${slot}">从此媒体同步</button>`:''}</div></div>`}

function notesFor(){if(state.drawer==='detail')return[{id:'a5',n:8,t:'资源矩阵',loc:'资源配置 > Key 详情',body:[['说明','按产品和 Locale 查看当前 Key 的媒体绑定。'],['交互','点击缩略图预览；点击同步复用；点击移除解除当前 SlotAssignment；访问 URL 可复制。']]},{id:'a6',n:10,t:'槽位预览与操作',loc:'Key 详情 > 产品×Locale 矩阵',body:[['状态/差异','空、已发布、冲突分别展示；槽位级支持预览、同步和解除绑定。']]},{id:'a7',n:9,t:'上传并组合',loc:'Key 详情 > 上传媒体',body:[['说明','产品和语言独立选择，按 C(产品，语言) 形成绑定目标；媒体资源可跨槽位复用。']] }];if(state.drawer==='key-preview')return[{id:'a5',n:8,t:'Key 媒体预览',loc:'Key 列表 > 预览',body:[['说明','集中查看当前 Key 的产品×Locale 媒体缩略图。'],['交互','点击缩略图打开浮层放大查看。']] }];if(state.drawer==='sync')return[{id:'a6',n:12,t:'源媒体预览',loc:'Key 详情 > 同步抽屉',body:[['说明','源槽位展示媒体预览和文件信息，点击可放大查看。']]},{id:'a7',n:13,t:'目标与冲突预览',loc:'同步抽屉 > 目标预览',body:[['状态/差异','每个目标展示已绑定媒体或空槽位；覆盖前必须确认。']]},{id:'a8',n:14,t:'原子提交',loc:'同步抽屉 > 底部操作',body:[['功能提示','任一目标校验失败时，不切换任何目标槽位当前指针。']] }];if(state.drawer==='import')return[{id:'a7',n:15,t:'媒体主体批量导入',loc:'批量导入 > 上传/映射',body:[['说明','上传阶段支持媒体行增删和独立重试；映射阶段逐行编辑 Key 与目标槽位。'],['交互','产品、语言独立选择后按 C(产品，语言) 展开；冲突策略在提交前选择。']]},{id:'a8',n:16,t:'整体失败与恢复',loc:'批量导入 > 导入失败',body:[['状态/差异','任一槽位导入失败，整体失败；原有槽位当前指针不变，可按同一任务重新提交。']] }];return[{id:'a1',n:1,t:'入口与主体',loc:'配置中心 > 资源配置',body:[['说明','与系统配置、多语言平级；列表主体是 Key，不是媒体文件。'],['数据来源','本原型使用演示数据，不代表当前 Dev 已有资源配置页面。']]},{id:'a2',n:2,t:'Key 列表',loc:'资源配置 > Key 列表',body:[['说明','展示槽位进度、媒体资源数、资源状态和最近 Key 调用时间。'],['交互','点击预览集中查看媒体；点击查看矩阵进入可编辑槽位。']]},{id:'a3',n:3,t:'筛选区',loc:'资源配置 > 查询区',body:[['交互','按 Key、产品、Locale、状态查询；产品与 Locale 允许全组合。']]},{id:'a4',n:4,t:'解析入口',loc:'Key 列表 > 解析入口',body:[['说明','解析 URL 需要精确 Key+产品+Locale 槽位；空槽位返回未配置。'],['功能提示','Key 最近调用时间聚合其全部槽位最大事件时间。']]},{id:'a5',n:5,t:'Key 预览入口',loc:'资源配置 > Key 列表',body:[['交互','点击预览打开当前 Key 的产品×Locale 缩略图总览；媒体点击后浮层放大。']] } ]}
function renderNotes(){const n=document.getElementById('notes');const list=notesFor();n.innerHTML=`<div class="notes-head"><h2>原型批注</h2><p>${state.drawer?'当前批注已切换到覆盖层':'右侧说明页面字段、状态和业务规则。点击批注可定位左侧元素。'}</p></div><div class="notes-list">${list.map(x=>`<article class="note-card ${state.selected===x.id?'active':''}" data-note="${x.id}"><div class="note-card-head"><span class="note-num">${x.n}</span><strong>${x.t}</strong></div><div class="note-location">关联位置：${x.loc}</div><div class="note-body">${x.body.map(b=>`<div class="note-section"><b>${b[0]}</b> ${b[1]}</div>`).join('')}</div></article>`).join('')}</div>`;n.querySelectorAll('[data-note]').forEach(x=>x.onclick=()=>{state.selected=x.dataset.note;renderNotes()})}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
function copyText(value){if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(value).then(()=>toast('已复制到剪贴板')).catch(()=>toast('复制失败，请手动复制'))}else{const el=document.createElement('textarea');el.value=value;el.style.position='fixed';el.style.opacity='0';document.body.appendChild(el);el.select();const ok=document.execCommand('copy');el.remove();toast(ok?'已复制到剪贴板':'复制失败，请手动复制')}}
function updateSelection(kind,value){const target=state.selectorMode==='import'?state.importSelection:state;const key=kind==='products'?'targetProducts':'targetLocales';const values=state.selectorMode==='import'?target[key]:target[key];const next=values.includes(value)?values.filter(x=>x!==value):[...values.filter(x=>x!=='通用'&&value!=='通用'),value];if(state.selectorMode==='import')state.importSelection[key]=next;else state[key]=next;renderLayer();renderNotes()}
function removeCombo(kind,combo){const [p,l]=combo.split('|');if(kind==='import'){state.importSelection.products=state.importSelection.products.filter(x=>x!==p);state.importSelection.locales=state.importSelection.locales.filter(x=>x!==l)}else{state.targetProducts=state.targetProducts.filter(x=>x!==p);state.targetLocales=state.targetLocales.filter(x=>x!==l)}renderLayer();renderNotes()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;if(a==='copy-url'){e.stopPropagation();copyText(b.dataset.copyValue);return}if(a==='detail'){state.detailKey=b.dataset.key;state.drawer='detail';state.previewFile=null;renderLayer();renderNotes()}else if(a==='key-preview'){state.detailKey=b.dataset.key||state.detailKey;state.drawer='key-preview';renderLayer();renderNotes()}else if(a==='close'){if(state.previewFile){state.previewFile=null;renderLayer();renderNotes()}else if(state.confirmSlot){state.confirmSlot=null;renderLayer();renderNotes()}else{state.drawer=null;renderLayer();renderNotes()}}else if(a==='create-key'){state.drawer='create-key';state.createKeyReturn=null;state.createKeyForIndex=null;state.createKeyDraft='';renderLayer();renderNotes()}else if(a==='create-key-from-import'){state.drawer='create-key';state.createKeyReturn='import';state.createKeyForIndex=+b.dataset.index;state.createKeyDraft='';renderLayer();renderNotes()}else if(a==='submit-create-key'){const input=document.querySelector('[data-create-key-input]');const value=(input?.value||'').trim();if(!/^[A-Za-z][A-Za-z0-9._-]*$/.test(value)){toast('资源 ID 首字符必须为字母，且只支持字母、数字、-、_、.');return}if(keyRows.some(x=>x.key===value)){toast('资源 ID 已存在，请直接选择已有资源 ID');return}keyRows.push({key:value,filled:0,total:products.length*locales.length,media:0,status:'ACTIVE',last:'暂无'});if(state.createKeyReturn==='import'){state.importRows[state.createKeyForIndex].key=value;state.drawer='import';state.importStage='map'}else{state.detailKey=value;state.drawer='detail'}state.createKeyReturn=null;state.createKeyForIndex=null;state.createKeyDraft='';renderLayer();renderNotes();toast(`已创建资源 ID：${value}`)}else if(a==='upload-media'){state.drawer='upload-media';state.mediaSelected=false;state.selectorMode='binding';renderLayer();renderNotes()}else if(a==='select-media'){state.mediaSelected=true;renderLayer();renderNotes();toast('已选择 sleep-guide-zh.webp')}else if(a==='bind-media'){state.drawer='detail';state.selectorMode=null;renderLayer();renderNotes();toast(`媒体资源已绑定到 ${targetCombos().length} 个槽位`)}else if(a==='slot'){const slot=b.dataset.slot;if(slotFiles[slot]){state.sourceSlot=slot;state.drawer='sync';renderLayer();renderNotes()}else{const [p,l]=slot.split('|');state.targetProducts=[p];state.targetLocales=[l];state.drawer='upload-media';state.selectorMode='binding';renderLayer();renderNotes();toast(`准备上传到 ${slot}`)}}else if(a==='sync'){e.stopPropagation();state.sourceSlot=b.dataset.slot;state.drawer='sync';state.previewFile=null;renderLayer();renderNotes()}else if(a==='sync-from-preview'){state.sourceSlot=b.dataset.slot;state.previewFile=null;state.drawer='sync';renderLayer();renderNotes()}else if(a==='preview-media'){e.stopPropagation();state.previewFile=b.dataset.file;state.previewSlot=b.dataset.slot||'';renderLayer();renderNotes()}else if(a==='remove-binding'){state.confirmSlot=b.dataset.slot;state.drawer='detail';renderLayer();renderNotes()}else if(a==='confirm-remove'){const s=state.confirmSlot;delete slotFiles[s];state.confirmSlot=null;renderLayer();renderNotes();toast(`已解除 ${s.replace('|',' × ')} 的绑定，媒体资源保留`)}else if(a==='sync-mode'){state.syncMode=b.dataset.mode;renderLayer();renderNotes()}else if(a==='policy'){state.overwrite=!state.overwrite;renderLayer();renderNotes()}else if(a==='apply-sync'){state.drawer='detail';renderLayer();renderNotes();toast('同步任务已提交，目标槽位已复用同一媒体资源')}else if(a==='toggle-choice'){updateSelection(b.dataset.dimension,b.dataset.value)}else if(a==='remove-combo'){removeCombo(b.dataset.kind,b.dataset.combo)}else if(a==='import'){state.drawer='import';state.importStage='upload';state.importRows=[];state.selectorMode=null;renderLayer();renderNotes()}else if(a==='add-import-media'){state.importRows.push({ref:`media-00${state.importRows.length+1}`,file:'product-tour.gif',key:'sleepGuide',progress:100,status:'done',targets:[]});renderLayer();renderNotes();toast('已添加媒体资源行')}else if(a==='remove-import'){const i=+b.dataset.index;state.importRows.splice(i,1);renderLayer();renderNotes();toast('已移除该媒体资源行')}else if(a==='retry-media'){const i=+b.dataset.index;state.importRows[i].status='done';state.importRows[i].progress=100;state.scenario='normal';document.getElementById('scenario').value='normal';renderLayer();renderNotes();toast('媒体已重新上传')}else if(a==='map-import'){state.importStage='map';renderLayer();renderNotes()}else if(a==='import-back-upload'){state.importStage='upload';renderLayer();renderNotes()}else if(a==='edit-import-slots'){state.selectorMode='import';state.selectorRef=+b.dataset.index;const t=state.importRows[state.selectorRef].targets;state.importSelection={products:[...new Set(t.map(x=>x.split('|')[0]))],locales:[...new Set(t.map(x=>x.split('|')[1]))]};state.importStage='select';renderLayer();renderNotes()}else if(a==='cancel-selector'){state.importStage='map';state.selectorMode=null;renderLayer();renderNotes()}else if(a==='apply-import-selector'){const row=state.importRows[state.selectorRef];row.targets=targetCombos(state.importSelection.products,state.importSelection.locales);state.importStage='map';state.selectorMode=null;renderLayer();renderNotes();toast(`已更新 ${row.ref} 的目标槽位`)}else if(a==='import-policy'){state.importOverwrite=!state.importOverwrite;renderLayer();renderNotes()}else if(a==='run-import'){if(state.scenario==='import-fail'){state.importStage='fail';renderLayer();renderNotes();toast('导入失败，原槽位未变化')}else{state.importStage='done';renderLayer();renderNotes();toast('导入任务已提交')}}else if(a==='retry-import'){state.importStage='map';state.scenario='normal';document.getElementById('scenario').value='normal';renderLayer();renderNotes();toast('已按相同任务重新提交')}else if(a==='query'){toast('已按当前筛选条件查询')}else if(a==='reset'){toast('筛选条件已重置')}})
document.addEventListener('change',e=>{if(e.target.matches('[data-import-key]')){state.importRows[+e.target.dataset.importKey].key=e.target.value;renderLayer();renderNotes();toast('已更新媒体关联 Key')}})
document.getElementById('scenario').addEventListener('change',e=>{state.scenario=e.target.value;if(state.drawer==='import'){state.importStage=e.target.value==='import-fail'?'fail':'upload';state.importRows=[];renderLayer();renderNotes()}else toast(`已切换演示状态：${e.target.options[e.target.selectedIndex].text}`)})
document.querySelectorAll('[data-mobile]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-mobile]').forEach(x=>x.classList.toggle('active',x===b));document.getElementById('appShell').classList.toggle('mobile-product',b.dataset.mobile==='product');document.getElementById('appShell').classList.toggle('mobile-notes',b.dataset.mobile==='notes')}))
render();
</script></body></html>
