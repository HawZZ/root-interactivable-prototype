  var asset={assetId:state.productCode+'-'+(globalThis.crypto&&crypto.randomUUID?crypto.randomUUID():Date.now()),name:file.name,size:file.size,format:file.name.split('.').pop().toLowerCase()};

function saveResources(confirmed){
 if(state.uploading)return;
 if(state.resourceKeys.some(function(key){return !!state.resourceErrors[key]&&!state.resourceErrors[key].startsWith('保存失败')})){toast('请先处理文件错误','error');return}
 var removed=state.resourceKeys.filter(function(key){return productResources[state.productCode][key]&&!state.resourceDraft[key]});

 if(state.saveResourceFault){state.saveResourceFault=false;state.resourceErrors[state.resourceKeys[0]]='保存失败，原文件未被覆盖。请重试。';renderOverlay();return}
 var next=productResources;state.resourceKeys.forEach(function(key){next=ProductResourceCore.update(next,state.productCode,key,state.resourceDraft[key])});
 try{saveResourceStorage(next)}catch(e){state.resourceErrors[state.resourceKeys[0]]='保存失败，请检查本地存储后重试。';renderOverlay();return}
 closeDrawer();render();toast('动态资源保存成功','success');
}

function renderWork(){
  var el=document.getElementById('work');
  el.innerHTML='<div class="work">'+renderHeader()+(state.step==='basic'?renderBasic():state.step==='provision'?renderProvision():'<div class="basic-card"><b>'+({feature:'功能设计',extension:'扩展程序',debug:'设备调试',advanced:'高级配置'}[state.step]||'产品详情')+'</b><p style="color:var(--muted)">当前页面保持现状，本需求只在基础信息和配网引导中增加能力。</p></div>')+'</div>';
}
function renderAnn(){
  var el=document.getElementById('ann'),n=currentNotes();
  el.innerHTML='<div class="review-control"><label>产品切换（原型辅助）<select id="review-product" class="input" onchange="switchReviewProduct(this.value)" '+(state.drawer?'disabled':'')+'><option value="A" '+(state.productCode==='A'?'selected':'')+'>A · V3测试</option><option value="B" '+(state.productCode==='B'?'selected':'')+'>B · 演示产品</option></select></label><label class="form-check"><input id="resource-fault" type="checkbox" '+(state.saveResourceFault?'checked':'')+' onchange="state.saveResourceFault=this.checked">下一次表单保存失败（演示）</label></div><div class="ann-switch"><button class="'+(state.surface==='product'&&state.step==='basic'?'active':'')+'" onclick="goStep(\'basic\')">基础信息</button><button class="'+(state.surface==='errors'?'active':'')+'" onclick="goSurface(\'errors\')">错误码资源</button><button class="'+(state.surface==='product'&&state.step==='provision'?'active':'')+'" onclick="goStep(\'provision\')">配网引导</button></div><h3 class="ann-title">'+n.title+'</h3><p class="ann-summary">'+n.summary+'</p><div class="notes">'+n.items.map(function(x){return '<div class="note '+(state.selected===x[0]?'selected':'')+'" onclick="pick('+x[0]+')"><span class="note-num">'+x[0]+'</span><div><h4>'+x[1]+'</h4><ul><li>'+x[2]+'</li><li>'+x[3]+'</li></ul></div></div>'}).join('')+'</div>'+resourceReading()+'<div class="assumption"><b>原型备注</b><br>产品详情保留原结构；仅新增两个动态资源入口。A/B与读取区是评审辅助，字段名为示意；B文件为演示数据。JSON真实播放器、App消费位置/正式字段及旧App兼容待技术落实。错误码保持原文本基线。</div>';
}
function render(){
  renderWork();
  var topTitle=document.querySelector('.top-title'),crumb=document.querySelector('.crumb');
  if(state.surface==='errors'){topTitle.textContent='配置中心';crumb.innerHTML='<span>配置中心</span><b>/</b><strong>错误码资源</strong>'}else{topTitle.textContent='智能产品';crumb.innerHTML='<span>查看产品详情</span><b>/</b><span>产品列表</span><b>/</b><strong>智能产品</strong>'}
  renderAnn();renderOverlay();
  document.querySelectorAll('.note-anchor').forEach(function(x){x.classList.toggle('active',x.getAttribute('data-anchor')===String(state.selected))});
}
function renderOverlay(){
  var scrollBody=document.querySelector('.drawer-body'),savedScroll=scrollBody?scrollBody.scrollTop:0;
  var out='';
  if(state.drawer)out+=renderDrawer();
  if(state.modal)out+=renderModal();
  if(state.toast)out+='<div class="toast '+state.toast.type+'">'+esc(state.toast.msg)+'</div>';
  document.getElementById('overlay').innerHTML=out;
  var nextBody=document.querySelector('.drawer-body');if(nextBody)nextBody.scrollTop=savedScroll;
}
function renderDrawer(){if(state.drawer==='resource')return renderResourceDrawer();if(state.drawer==='provision')return renderProvisionDrawer();return ''}
function renderProvisionDrawer(){var multi=state.preview==='multi';return '<div class="drawer-mask" onclick="if(event.target===this)closeDrawer()"><section class="drawer"><header class="drawer-head"><b class="drawer-title">编辑配网引导 · '+(multi?'多页面配网':'单页面配网')+'</b><button class="close" onclick="closeDrawer()">×</button></header><div class="drawer-body">'+(multi?renderMultiForm():renderSingleForm())+'</div><footer class="drawer-foot"><button class="btn" onclick="closeDrawer()">取消</button><button class="btn btn-primary" onclick="saveProvision()">保存'+(multi?anchor(19):'')+'</button></footer></section></div>'}
function plainRich(html){var div=document.createElement('div');div.innerHTML=html;return div.textContent||''}
function sanitizeRich(html){var root=document.createElement('div');root.innerHTML=html;root.querySelectorAll('script,style,iframe,object').forEach(function(n){n.remove()});root.querySelectorAll('*').forEach(function(n){if(!['P','DIV','BR','STRONG','B','UL','LI'].includes(n.tagName)){n.replaceWith(document.createTextNode(n.textContent));return}Array.from(n.attributes).forEach(function(a){n.removeAttribute(a.name)})});return root.innerHTML}
function formatSingleRich(command){var editor=document.querySelector('#r-editor');if(!editor)return;editor.focus();document.execCommand(command);state.rich=editor.innerHTML}
function renderSingleForm(){return '<div class="drawer-section"><div class="form-row"><div class="form-label required">语言</div><div class="input">'+esc((languages.find(function(l){return l[0]===state.lang})||languages[0])[1])+'</div></div><div class="form-row"><div class="form-label required">配网引导图</div><div class="upload"><div class="upload-icon">图</div><div class="upload-info"><strong>沿用现有配置</strong><span>配网引导图原上传规则保持</span></div></div></div><div class="form-row"><label class="form-label" for="single-guide">配网指引</label><input id="single-guide" class="input" value="'+esc(state.singleGuideDraft)+'" oninput="state.singleGuideDraft=this.value"></div><div class="form-row"><div class="form-label required">配网文案'+anchor(10)+'</div><div><div class="toolbar"><button type="button" class="tool" aria-label="加粗" onmousedown="event.preventDefault()" onclick="document.querySelector(\'#r-editor\').focus();document.execCommand(\'bold\')"><b>B</b></button><button type="button" class="tool" style="width:auto;padding:0 7px" aria-label="无序列表" onmousedown="event.preventDefault()" onclick="formatSingleRich(\'insertUnorderedList\')">• 无序列表</button><button type="button" class="tool" aria-label="清除格式" onclick="document.querySelector(\'#r-editor\').focus();document.execCommand(\'removeFormat\')">T</button><span class="form-help">支持换行、加粗和无序列表</span></div><div id="r-editor" role="textbox" aria-label="配网文案" class="rich" contenteditable="true" oninput="state.rich=this.innerHTML">'+sanitizeRich(state.rich)+'</div></div></div></div>'}
function multiError(key){return state.multiErrors[key]?'<div class="field-error" role="alert">'+esc(state.multiErrors[key])+'</div>':''}
function multiField(pi,field,label,value,max,required,textarea){
  var key='page-'+pi+'-'+field;
  var input=textarea?'<textarea':'<input type="text"';
  input+=' id="'+key+'" aria-label="步骤 '+(pi+1)+' '+label+'" class="'+(textarea?'textarea':'input')+(state.multiErrors[key]?' invalid':'')+'" maxlength="'+max+'" oninput="state.draftPages['+pi+'].'+field+'=this.value;'+(textarea?'this.nextElementSibling.textContent=this.value.length+\' / '+max+'\';':'')+'"';
  input+=textarea?'>'+esc(value)+'</textarea><div class="char-count">'+value.length+' / '+max+'</div>':' value="'+esc(value)+'">';
  return '<div class="form-row"><label for="'+key+'" class="form-label '+(required?'required':'')+'">'+label+'</label><div>'+input+multiError(key)+'</div></div>';
}
function multiUpload(pi,ci,si){
  var page=state.draftPages[pi],sub=ci!=null,item=sub?page.copies[ci].subs[si]:page;
  var action=sub?'setMultiImage('+pi+','+ci+','+si+')':'setMultiImage('+pi+')';
  var clear=sub?'setMultiImage('+pi+','+ci+','+si+',true)':'setMultiImage('+pi+',null,null,true)';
  return '<div class="upload"><div class="upload-icon">图</div><div class="upload-info"><strong>'+esc(item.img||'点击上传')+'</strong><span>'+(sub?'图片可选':'建议尺寸 800px×600px，大小不超过 3M')+'</span></div><button type="button" class="btn btn-sm" onclick="'+action+'">'+(item.img?'替换':'上传')+'</button>'+(item.img?'<button type="button" class="btn btn-sm" onclick="'+clear+'">移除</button>':'')+'</div>'+(!sub?'<div class="form-help">支持 png / jpg / jpeg / gif / json</div>':'');
}
function renderMultiForm(){
  var pages=state.draftPages;
  return '<div class="form-row"><label class="form-label required" for="multi-language">语言'+anchor(15)+'</label><select id="multi-language" class="input" aria-label="语言" onchange="switchDraftLanguage(this.value)">'+languages.map(function(l){return '<option value="'+l[0]+'" '+(l[0]===state.draftLang?'selected':'')+'>'+l[1]+'</option>'}).join('')+'</select></div>'+pages.map(function(page,pi){
    return '<section class="step-editor" data-page="'+pi+'"><header class="step-editor-head"><b><span class="step-square">'+(pi+1)+'</span>步骤 '+(pi+1)+'</b><button type="button" class="btn btn-sm" '+(pages.length<=1?'disabled':'')+' onclick="deleteMultiPage('+pi+')">删除步骤</button></header><div class="step-editor-body">'+
      '<div class="form-row"><div class="form-label required">配网引导图'+(pi===0?anchor(16):'')+'</div><div id="page-'+pi+'-img">'+multiUpload(pi)+multiError('page-'+pi+'-img')+'</div></div>'+
      multiField(pi,'txt','配网文案',page.txt,500,true,true)+
      multiField(pi,'auxTxt','辅助文案',page.auxTxt,300,false,false)+
      '<div class="form-row"><div class="form-label">辅助文案选中</div><div><label class="form-check"><input aria-label="步骤 '+(pi+1)+' 辅助文案选中" type="checkbox" '+(page.auxSelectable?'checked':'')+' onchange="state.draftPages['+pi+'].auxSelectable=this.checked;renderOverlay()">'+(page.auxSelectable?'已启用':'未启用')+'</label><div class="form-help">启用后，辅助文案可用于 App 内二次确认</div></div></div>'+
      multiField(pi,'btnTxt','按钮文案',page.btnTxt,30,false,false)+
      '<div class="form-row"><div class="form-label">引导文案'+(pi===0?anchor(17):'')+'</div><div><label class="form-check"><input aria-label="步骤 '+(pi+1)+' 启用引导文案" type="checkbox" '+(page.guideEnabled?'checked':'')+' onchange="state.draftPages['+pi+'].guideEnabled=this.checked;renderOverlay()">'+(page.guideEnabled?'已启用':'未启用')+'</label><div class="form-help">'+page.copies.length+' / 3 条引导文案；启用后文案必填，每条关联 1～5 个子步骤。</div></div></div>'+
      page.copies.map(function(c,ci){return renderCopyForm(page,pi,c,ci)}).join('')+
      '<button type="button" class="btn btn-sm add-copy" onclick="addCopy('+pi+')" '+(!page.guideEnabled||page.copies.length>=3?'disabled':'')+'>+ 新增引导文案</button></div></section>';
  }).join('')+'<button type="button" class="btn add-page" onclick="addMultiPage()">+ 新增步骤</button>';
}
function renderCopyForm(page,pi,c,ci){
  var prefix='copy-'+pi+'-'+ci,disabled=page.guideEnabled?'':'disabled';
  return '<div class="copy-edit"><div class="copy-head">引导文案 '+(ci+1)+'<button type="button" class="btn btn-sm" '+(!page.guideEnabled||page.copies.length<=1?'disabled':'')+' onclick="deleteCopy('+pi+','+ci+')">删除</button></div><div class="form-row"><label for="'+prefix+'" class="form-label '+(page.guideEnabled?'required':'')+'">引导文案</label><div><input id="'+prefix+'" aria-label="步骤 '+(pi+1)+' 引导文案 '+(ci+1)+'" class="input '+(state.multiErrors[prefix]?'invalid':'')+'" '+disabled+' value="'+esc(c.title)+'" oninput="state.draftPages['+pi+'].copies['+ci+'].title=this.value">'+multiError(prefix)+'</div></div>'+(page.guideEnabled?'<div class="limit">子步骤 '+c.subs.length+' / 5'+(pi===0&&ci===0?anchor(18):'')+'</div>'+c.subs.map(function(sub,si){
    var subPrefix=prefix+'-sub-'+si;
    return '<div class="sub-edit"><div class="copy-head">子步骤 '+(si+1)+'<button type="button" class="btn btn-sm" '+(c.subs.length<=1?'disabled':'')+' onclick="deleteSub('+pi+','+ci+','+si+')">删除子步骤</button></div><div class="form-row"><div class="form-label">图片</div><div>'+multiUpload(pi,ci,si)+'</div></div><div class="form-row"><label for="'+subPrefix+'-title" class="form-label required">标题</label><div><input id="'+subPrefix+'-title" class="input '+(state.multiErrors[subPrefix+'-title']?'invalid':'')+'" value="'+esc(sub.title)+'" oninput="state.draftPages['+pi+'].copies['+ci+'].subs['+si+'].title=this.value">'+multiError(subPrefix+'-title')+'</div></div><div class="form-row"><label for="'+subPrefix+'-body" class="form-label required">正文</label><div><textarea id="'+subPrefix+'-body" class="textarea '+(state.multiErrors[subPrefix+'-body']?'invalid':'')+'" oninput="state.draftPages['+pi+'].copies['+ci+'].subs['+si+'].body=this.value">'+esc(sub.body)+'</textarea>'+multiError(subPrefix+'-body')+'</div></div></div>';
  }).join('')+'<button type="button" class="btn btn-sm" onclick="addSub('+pi+','+ci+')" '+(c.subs.length>=5?'disabled':'')+'>+ 新增子步骤</button>':'')+'</div>';
}
function emptyMultiPage(){return {title:'',img:'',txt:'',auxTxt:'',auxSelectable:false,btnTxt:'',guideEnabled:false,copies:[{title:'',subs:[{img:'',title:'',body:''}]}]}}
function addMultiPage(){state.draftPages.push(emptyMultiPage());renderOverlay()}
function deleteMultiPage(pi){if(state.draftPages.length<=1)return;state.draftPages.splice(pi,1);state.multiErrors={};renderOverlay()}
function addCopy(pi){if(!state.draftPages[pi].guideEnabled||state.draftPages[pi].copies.length>=3)return;state.draftPages[pi].copies.push({title:'',subs:[{img:'',title:'',body:''}]});renderOverlay()}
function deleteCopy(pi,ci){if(state.draftPages[pi].copies.length<=1)return;state.draftPages[pi].copies.splice(ci,1);state.multiErrors={};renderOverlay()}
function addSub(pi,ci){if(state.draftPages[pi].copies[ci].subs.length>=5)return;state.draftPages[pi].copies[ci].subs.push({img:'',title:'',body:''});renderOverlay()}
function deleteSub(pi,ci,si){if(state.draftPages[pi].copies[ci].subs.length<=1)return;state.draftPages[pi].copies[ci].subs.splice(si,1);state.multiErrors={};renderOverlay()}
function setMultiImage(pi,ci,si,clear){var item=ci!=null?state.draftPages[pi].copies[ci].subs[si]:state.draftPages[pi];item.img=clear?'':(ci!=null?'substep-'+(pi+1)+'-'+(ci+1)+'-'+(si+1)+'.png':'step-'+(pi+1)+'.png');renderOverlay()}
function loadSingleLanguage(lang){var saved=state.singleByLanguage[lang];state.singleConfigured=!!saved;state.richSaved=saved?saved.rich:'<p>请打开设备蓝牙并允许必要权限。</p>';state.rich=state.richSaved;state.singleGuide=saved?saved.guide:'请将设备靠近手机。';state.singleGuideDraft=state.singleGuide}
function selectPreview(mode){state.preview=mode;if(mode==='multi')state.pages=JSON.parse(JSON.stringify(state.multiByLanguage[state.lang]||[]));else loadSingleLanguage(state.lang);render()}
function selectProvisionLanguage(lang){state.lang=lang;if(state.preview==='multi')state.pages=JSON.parse(JSON.stringify(state.multiByLanguage[lang]||[]));else loadSingleLanguage(lang);render()}
function switchDraftLanguage(lang){state.draftLang=lang;state.draftPages=JSON.parse(JSON.stringify(state.multiByLanguage[lang]||[emptyMultiPage()]));state.multiErrors={};renderOverlay()}
function saveProvision(){
  if(state.preview==='single'){var editor=document.querySelector('#r-editor');var html=sanitizeRich(editor?editor.innerHTML:state.rich);if(!plainRich(html).trim()){toast('请输入配网文案','error');return}if(plainRich(html).length>500){toast('配网文案不能超过500字','error');return}state.richSaved=html;state.rich=html;state.singleGuide=state.singleGuideDraft;state.singleConfigured=true;state.singleByLanguage[state.lang]={rich:html,guide:state.singleGuide}}
  if(state.preview==='multi'){
    state.multiErrors={};
    state.draftPages.forEach(function(page,pi){
      var pre='page-'+pi+'-';if(!page.img)state.multiErrors[pre+'img']='请上传配网引导图';if(!page.txt.trim())state.multiErrors[pre+'txt']='请输入配网文案';
      if(page.guideEnabled)page.copies.forEach(function(c,ci){var cp='copy-'+pi+'-'+ci;if(!c.title.trim())state.multiErrors[cp]='请输入引导文案';c.subs.forEach(function(sub,si){var sp=cp+'-sub-'+si;if(!sub.title.trim())state.multiErrors[sp+'-title']='请输入子步骤标题';if(!sub.body.trim())state.multiErrors[sp+'-body']='请输入子步骤正文'})});
    });
    var errors=Object.keys(state.multiErrors);if(errors.length){renderOverlay();var target=document.getElementById(errors[0]);if(target){target.scrollIntoView({block:'center'});if(target.focus)target.focus()}return}
    state.pages=JSON.parse(JSON.stringify(state.draftPages));state.lang=state.draftLang;state.multiByLanguage[state.lang]=JSON.parse(JSON.stringify(state.pages));
  }
  closeDrawer();toast('配网引导保存成功','success');render();
}
function renderModal(){
 if(!state.modal)return '';var m=state.modal,clear=m.kind==='clearResources',label=clear?m.keys.map(resourceLabel).join('、'):resourceLabel(m.key);
 return '<div class="modal-mask"><section class="modal" role="dialog" aria-modal="true" aria-label="删除动态资源"><h3>删除'+esc(label)+'</h3><p>确认删除当前产品的'+esc(label)+'？其他用途和产品不受影响。</p><div class="modal-foot"><button class="btn" onclick="state.modal=null;renderOverlay()">取消</button><button class="btn btn-danger" onclick="'+(clear?'state.modal=null;state.resourceErrors={};saveResources(true)':'confirmDeleteResource(\''+m.key+'\')')+'">确认删除</button></div></section></div>';
}

window.openDrawer=openDrawer;window.closeDrawer=closeDrawer;window.goSurface=goSurface;window.goStep=goStep;window.pick=pick;window.render=render;window.renderOverlay=renderOverlay;window.toast=toast;window.addCopy=addCopy;window.deleteCopy=deleteCopy;window.addSub=addSub;window.deleteSub=deleteSub;window.saveProvision=saveProvision;
state.multiByLanguage.en=JSON.parse(JSON.stringify(state.pages));
var defaultGuideState=guideSnapshot();
document.addEventListener('change',function(e){if(e.target.dataset.dynamicFile)chooseDynamicFile(e.target.dataset.dynamicFile,e.target.files[0])});
document.addEventListener('mousedown',function(e){if(e.target.closest('.tool'))e.preventDefault()});
document.getElementById('work').addEventListener('click',function(e){var button=e.target.closest('[data-action="edit-provision"]');if(!button)return;e.preventDefault();e.stopPropagation();openDrawer('provision')});
var initialStep=new URLSearchParams(window.location.search).get('step');if(initialStep==='basic'||initialStep==='provision')state.step=initialStep;
// basic-editor.js restores the observed product form and renders it.
</script>
<script src="./basic-editor.js"></script>
</body>
</html>
