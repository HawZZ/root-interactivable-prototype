<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>IoT 平台数据权限</title>
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/app.css">
  <link rel="stylesheet" href="styles/drawer.css">
</head>
<body>
  <main class="shell">
    <section class="product-frame">
      <div class="canvas">
        <aside class="nav">
          <div class="logo">luteos <small>IoT Admin</small></div>
          <div class="nav-group">概览</div>
          <div class="nav-group active">智能产品</div>
          <div class="nav-sub">产品列表</div>
          <div class="nav-sub">消息推送</div>
          <div class="nav-group">设备管理</div>
          <div class="nav-group">App</div>
          <div class="nav-group">配置中心</div>
          <div class="nav-group active2">系统管理</div>
          <div class="nav-sub selected">数据权限管理</div>
        </aside>

        <section class="main">
          <header>
            <span class="crumb">系统管理 / 数据权限管理</span>
            <span class="user">管理员 · chen.wei@momcozy.com</span>
          </header>
          <div class="page">
            <div class="title-row">
              <div>
                <h1>数据权限管理</h1>
                <p>按产品配置用户与数据角色的可访问范围</p>
              </div>
            </div>

            <div class="tabs">
              <button class="tab active" data-tab="users">用户授权</button>
              <button class="tab" data-tab="roles">数据角色</button>
            </div>

            <section id="users" class="view active">
              <div class="filters">
                <input class="el-input" placeholder="用户名 / 邮箱" value="">
                <select class="el-select">
                  <option>全部授权状态</option>
                  <option>已授权</option>
                  <option>临时全量</option>
                </select>
                <button class="el-btn el-btn--primary">查询</button>
                <button class="el-btn">重置</button>
              </div>
              <table class="el-table">
                <thead><tr><th>用户</th><th>ERP 角色</th><th>直授产品</th><th>数据角色</th><th>有效产品范围</th><th>操作</th></tr></thead>
                <tbody id="userRows"></tbody>
              </table>
              <div class="pager">共 3 条　‹　<b>1</b>　›　 10条/页</div>
            </section>

            <section id="roles" class="view">
              <div class="filters">
                <input class="el-input" placeholder="角色名称">
                <button class="el-btn el-btn--primary">查询</button>
                <button class="el-btn">重置</button>
                <button class="el-btn el-btn--primary right">+ 新建数据角色</button>
              </div>
              <table class="el-table">
                <thead><tr><th>数据角色</th><th>负责人</th><th>成员数</th><th>授权产品</th><th>状态</th><th>操作</th></tr></thead>
                <tbody>
                  <tr><td>北美泵产品组</td><td>王琳</td><td>8</td><td>3 个产品</td><td><span class="tag success">启用</span></td><td><button class="op">管理成员</button><i>|</i><button class="op">查看</button></td></tr>
                  <tr><td>欧洲运营组</td><td>李浩</td><td>5</td><td>2 个产品</td><td><span class="tag success">启用</span></td><td><button class="op">管理成员</button><i>|</i><button class="op">查看</button></td></tr>
                  <tr><td>系统临时全量角色</td><td>全局管理员</td><td>12</td><td>全部产品（动态）</td><td><span class="tag success">启用</span></td><td><button class="op">管理成员</button><i>|</i><button class="op">查看</button></td></tr>
                </tbody>
              </table>
            </section>
          </div>
        </section>
      </div>

      <div class="drawer-host" id="drawer">
        <div class="mask"></div>
        <aside class="drawer">
          <header><h2 id="drawerTitle">用户授权</h2><button id="close">×</button></header>
          <div class="drawer-body" id="drawerBody"></div>
          <footer><button class="el-btn" id="cancel">取消</button><button class="el-btn el-btn--primary" id="confirm">确认授权</button></footer>
        </aside>
      </div>
    </section>

    <aside class="notes">
      <div class="note-head">
        <h2>原型批注</h2>
        <p id="noteContext">用户授权 · 页面态</p>
      </div>
      <div id="notes"></div>
    </aside>
  </main>

  <div id="toast"></div>
  <script type="module" src="app/index.js"></script>
</body>
</html>
