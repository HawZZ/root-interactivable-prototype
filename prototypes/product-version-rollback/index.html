<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="prototype:revision" content="20261103-split-rollback">
<title>IoT Admin 产品版本回滚原型</title>
<meta name="description" content="查看只读历史基础信息、核对逐字段差异并审批回滚；保留整体产品状态、公开范围与白名单授权。">
<meta name="keywords" content="版本回滚,基础信息版本,字段差异,变更审批">
<meta name="prototype:product-line" content="IoT Admin">
<meta name="prototype:business-area" content="IoT Admin">
<meta name="prototype:surface" content="web">
<meta name="prototype:systems" content="web">
<link rel="stylesheet" href="./styles/tokens.css">
<link rel="stylesheet" href="./styles/app.css">
</head>
<body>
<div class="m-tabs" id="mTabs">
  <button class="m-tab active" data-mtab="product" type="button">产品页面</button>
  <button class="m-tab" data-mtab="ann" type="button">原型批注</button>
</div>
<div class="proto-shell">
  <div class="product-pane" id="pane">
    <div class="canvas" id="canvas"></div>
  </div>
  <aside class="ann" aria-label="原型批注">
    <div class="ann-hd">
      <div class="ann-title"><span>原型批注</span><span class="ann-count" id="annCount"></span></div>
      <div class="ann-ctx" id="annCtx"></div>
      <div class="ann-hint" id="prototype-revision">评审版本：2026-11-03 · 产品版本回滚</div>
      <div class="ann-hint">黄色编号为批注锚点，不属于真实产品 UI；点击批注卡片或编号可互相定位。</div>
    </div>
    <div class="ann-list" id="annList"></div>
  </aside>
</div>
<div class="scrim" id="basic-scrim"></div>
<div class="drawer" id="basic-drawer" aria-label="编辑产品信息"></div>
<div class="mscrim" id="mscrim"><div id="modalSlot"></div></div>
<div class="toast" id="toast" role="status"></div>
<script type="module" src="./app/index.js"></script>
</body>
</html>
